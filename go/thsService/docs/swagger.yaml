basePath: /
definitions:
  health.Data:
    properties:
      status:
        example: ok
        type: string
    type: object
  health.SuccessResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/health.Data'
      message:
        example: ok
        type: string
      requestId:
        example: f5e76095d32f49199f5f7f897f5733a2
        type: string
    type: object
  index.Data:
    properties:
      message:
        example: 成功访问接口
        type: string
    type: object
  index.SuccessResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/index.Data'
      message:
        example: ok
        type: string
      requestId:
        example: f5e76095d32f49199f5f7f897f5733a2
        type: string
    type: object
  internal_auth.AuthData:
    properties:
      accessToken:
        type: string
      expiresIn:
        example: 7200
        type: integer
      tokenType:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    type: object
  internal_auth.LoginRequest:
    properties:
      account:
        example: "13800138000"
        type: string
      password:
        example: Example123
        type: string
    required:
    - account
    - password
    type: object
  internal_auth.LoginResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/internal_auth.AuthData'
      message:
        example: ok
        type: string
      requestId:
        example: f5e76095d32f49199f5f7f897f5733a2
        type: string
    type: object
  internal_auth.RegisterRequest:
    properties:
      account:
        example: "13800138000"
        type: string
      password:
        example: Example123
        type: string
      realName:
        example: 张三
        type: string
    required:
    - account
    - password
    - realName
    type: object
  internal_auth.RegisterResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/internal_auth.AuthData'
      message:
        example: ok
        type: string
      requestId:
        example: f5e76095d32f49199f5f7f897f5733a2
        type: string
    type: object
  internal_auth.UserResponse:
    properties:
      account:
        example: 138****8000
        type: string
      id:
        example: 1
        type: integer
      realName:
        example: 张三
        type: string
    type: object
  internal_market.QuoteItem:
    properties:
      changeAmount:
        example: "-13.11"
        type: string
      changePercent:
        example: "-1.02"
        type: string
      currency:
        example: CNY
        type: string
      dataStatus:
        enum:
        - live
        - stale
        - mock
        example: live
        type: string
      latestPrice:
        example: "1274.89"
        type: string
      market:
        example: CN
        type: string
      name:
        example: 贵州茅台
        type: string
      quoteTime:
        type: string
      symbol:
        example: 600519.SH
        type: string
    type: object
  internal_market.QuoteListData:
    properties:
      category:
        example: a_stock
        type: string
      categoryName:
        example: A股
        type: string
      items:
        items:
          $ref: '#/definitions/internal_market.QuoteItem'
        type: array
    type: object
  internal_market.QuoteListResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/internal_market.QuoteListData'
      message:
        example: ok
        type: string
      requestId:
        type: string
    type: object
  internal_portfolio.Account:
    properties:
      availableCash:
        type: string
      currency:
        type: string
      dailyProfit:
        type: string
      dailyProfitPercent:
        type: string
      floatingProfit:
        type: string
      generatedAt:
        type: string
      generation:
        type: string
      positionRatio:
        type: string
      totalAssets:
        type: string
      totalMarketValue:
        type: string
      withdrawableCash:
        type: string
    type: object
  internal_portfolio.Data:
    properties:
      account:
        $ref: '#/definitions/internal_portfolio.Account'
      positions:
        items:
          $ref: '#/definitions/internal_portfolio.Position'
        type: array
      simulated:
        example: true
        type: boolean
    type: object
  internal_portfolio.HoldingItem:
    properties:
      notice:
        type: string
      position:
        $ref: '#/definitions/internal_portfolio.Position'
      positionRatio:
        type: string
      trades:
        items:
          $ref: '#/definitions/internal_portfolio.Trade'
        type: array
    type: object
  internal_portfolio.HoldingsData:
    properties:
      account:
        $ref: '#/definitions/internal_portfolio.Account'
      category:
        type: string
      categoryName:
        type: string
      exchangeRateMode:
        example: demo_fixed
        type: string
      items:
        items:
          $ref: '#/definitions/internal_portfolio.HoldingItem'
        type: array
      simulated:
        type: boolean
    type: object
  internal_portfolio.HoldingsResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/internal_portfolio.HoldingsData'
      message:
        type: string
      requestId:
        type: string
    type: object
  internal_portfolio.Position:
    properties:
      availableQuantity:
        type: integer
      costPrice:
        type: string
      currency:
        type: string
      dailyProfit:
        type: string
      dailyProfitPercent:
        type: string
      dataStatus:
        type: string
      exchangeRate:
        type: string
      holdingDays:
        type: integer
      id:
        type: integer
      latestPrice:
        type: string
      marketValue:
        type: string
      name:
        type: string
      profit:
        type: string
      profitPercent:
        type: string
      quantity:
        type: integer
      quoteTime:
        type: string
      realizedProfit:
        type: string
      symbol:
        type: string
      transactionFees:
        type: string
    type: object
  internal_portfolio.PositionResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/internal_portfolio.Data'
      message:
        type: string
      requestId:
        type: string
    type: object
  internal_portfolio.Trade:
    properties:
      amount:
        type: string
      currency:
        type: string
      fees:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: string
      quantity:
        type: integer
      side:
        type: string
      symbol:
        type: string
      tradedAt:
        type: string
    type: object
  internal_portfolio.TradeList:
    properties:
      generation:
        type: string
      items:
        items:
          $ref: '#/definitions/internal_portfolio.Trade'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      simulated:
        type: boolean
      total:
        type: integer
    type: object
  internal_portfolio.TradeResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/internal_portfolio.TradeList'
      message:
        type: string
      requestId:
        type: string
    type: object
  ths-service_internal_response.ErrorEnvelope:
    properties:
      code:
        example: 40001
        type: integer
      data:
        type: object
      message:
        example: 请求参数错误
        type: string
      requestId:
        example: f5e76095d32f49199f5f7f897f5733a2
        type: string
    type: object
info:
  contact: {}
  description: thsService 模拟证券服务接口文档
  title: thsService API
  version: "1.0"
paths:
  /api/app/auth/login:
    post:
      consumes:
      - application/json
      description: 使用已注册的中国大陆手机号或邮箱登录
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
      summary: 用户登录
      tags:
      - 认证
  /api/app/auth/register:
    post:
      consumes:
      - application/json
      description: 使用中国大陆手机号或邮箱注册，真实姓名必填；同一 IP 一分钟只能请求一次
      parameters:
      - description: 注册参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
      summary: 用户注册
      tags:
      - 认证
  /api/app/market/holdings:
    get:
      description: 按用户和分类独立保存，不返回quote行情和零持仓。传totalAssets会物理删除当前分类旧记录并生成全新3-5个持仓，每个15条成交；不传时有记录直接查库，无记录在200000至1000000元间随机生成资产后落库。各分类独立使用各自总资产，不合并计算，不影响其他分类和原portfolio接口。金额不足以买入3个标的最小交易单位时返回400且保留旧记录。资产、市值和盈亏为人民币，成本/现价及成交为原币种；USD按7.10、HKD按0.91演示汇率折算，税费为0。id仅在当前分类generation内唯一。
      parameters:
      - description: 行情分类
        enum:
        - global
        - a_stock
        - hk_stock
        - us_stock
        - etf
        - future
        - gold
        - convertible_bond
        - other
        in: query
        name: category
        required: true
        type: string
      - description: 按指定总资产重建演示数据（人民币元），10000至1000000000，最多两位小数，如500000.00
        in: query
        name: totalAssets
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_portfolio.HoldingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: 获取分类的3-5个持仓及每个15条交易记录
      tags:
      - 行情
  /api/app/market/quotes:
    get:
      description: 返回指定分类下配置的行情；数据可能来自公开行情、历史缓存或模拟降级数据
      parameters:
      - description: 行情分类
        enum:
        - global
        - a_stock
        - hk_stock
        - us_stock
        - etf
        - future
        - gold
        - convertible_bond
        - other
        in: query
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_market.QuoteListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: 获取分类行情列表
      tags:
      - 行情
  /api/app/portfolio/trades:
    get:
      description: 返回当前这套模拟持仓对应的买入成交，按成交时间倒序；尚未生成持仓时返回空列表；重建持仓后只展示新一套成交，旧记录保留在数据库。成交不含手续费。
      parameters:
      - default: 1
        description: 页码
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_portfolio.TradeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ths-service_internal_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: 获取当前用户的模拟历史成交
      tags:
      - 模拟持仓
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer 加一个空格，再输入登录返回的 accessToken
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
