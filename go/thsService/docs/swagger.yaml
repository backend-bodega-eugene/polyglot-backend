  /api/admin/deleted-members/{userID}/restore:
    post:
      description: 管理员Cookie与同源校验。仅恢复已删除会员，清空deleted_at并设置status=1；原ID、密码、账号及全部关联数据保持不变。恢复与审计同事务。不存在或已恢复返回404，不重复记录恢复操作。无需请求体。不提供物理删除。
      parameters:
      - description: 已删除会员ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
