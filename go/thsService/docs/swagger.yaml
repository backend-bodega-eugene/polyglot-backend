info:
  contact: {}
  description: THS模拟展示服务。Swagger按App端与后台分别展示，默认只加载App文档；顶部切换分组，各业务分类可折叠。所有App共用会员登录，后台使用独立管理员会话。各业务的成功码、字段及日期格式保持各自客户端协议。
  title: thsService API
  version: "1.0"
paths:
  /api/admin/alipay/{kind}:
    get:
      description: 管理员Cookie鉴权。支持会员ID、年度和关键词查询，不生成记录。kind为profile/insurance/records/accounts/electric/water，全部按会员保存。
      parameters:
      - description: 业务类型
        in: path
        name: kind
        required: true
        type: string
      - description: 会员ID
        in: query
        name: userId
        type: integer
      - description: 年度
        in: query
        name: year
        type: integer
      - description: 业务数据关键词
        in: query
        name: q
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AlipayListResponse'
      summary: 分页查询支付宝模拟业务记录，不自动生成
      tags:
      - 后台 · 支付宝模拟业务
    post:
      consumes:
      - application/json
      description: 管理员Cookie鉴权。payload字段见schemas，全部记录须有效userId，records需要year，同年月同单位唯一；其他每会员一条。新建不传expectedVersion。写入及审计同事务。
      parameters:
      - description: 业务类型
        in: path
        name: kind
        required: true
        type: string
      - description: 业务记录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/alipay.Write'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AlipayRecordResponse'
      summary: 新增模拟支付宝模拟业务记录
      tags:
      - 后台 · 支付宝模拟业务
  /api/admin/alipay/{kind}/{recordID}:
    delete:
      consumes:
      - application/json
      description: 需expectedVersion。某类数据整组删空后App再次查询自动生成，部分删除不补齐。不删除会员或用电资料。
      parameters:
      - description: 业务类型
        in: path
        name: kind
        required: true
        type: string
      - description: 记录ID
        in: path
        name: recordID
        required: true
        type: integer
      - description: 仅需expectedVersion
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/alipay.Write'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 删除模拟支付宝模拟业务记录并保留审计
      tags:
      - 后台 · 支付宝模拟业务
    get:
      parameters:
      - description: 业务类型
        in: path
        name: kind
        required: true
        type: string
      - description: 记录ID
        in: path
        name: recordID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AlipayRecordResponse'
      summary: 查询支付宝模拟业务记录详情
      tags:
      - 后台 · 支付宝模拟业务
    put:
      consumes:
      - application/json
      description: 需详情version作为expectedVersion，不能更换所属会员。冲突409，字段无效400。
      parameters:
      - description: 业务类型
        in: path
        name: kind
        required: true
        type: string
      - description: 记录ID
        in: path
        name: recordID
        required: true
        type: integer
      - description: 完整payload及expectedVersion
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/alipay.Write'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AlipayRecordResponse'
      summary: 修改模拟支付宝模拟业务记录
      tags:
      - 后台 · 支付宝模拟业务
  /api/admin/alipay/records/generate:
    post:
      consumes:
      - application/json
      description: 管理员Cookie鉴权。五险逐项按基数乘费率计算并四舍五入到分，再汇总单位和个人金额。所提交规则应用整个区间，历史政策变化请分段提交。基数须按当地年度上下限确认；不含公积金，深户养老地方补充请计入单位费率。同会员已有月份一律跳过，不覆盖任何单位的记录；最多120个月，不生成未来月份。记录和审计同事务保存，App累计信息自动汇总。
      parameters:
      - description: 会员、起止月份、月薪、单位和五险规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/alipay.GenerateContributions'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AlipayGenerationResponse'
      summary: 按月份范围批量生成会员五险缴费记录
      tags:
      - 后台 · 支付宝模拟业务
  /api/admin/alipay/records/generate-preview:
    post:
      consumes:
      - application/json
      description: 参数与批量生成相同，不写入缴费记录。并发编辑可能使实际生成数量与预览不同。
      parameters:
      - description: 生成参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/alipay.GenerateContributions'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AlipayGenerationResponse'
      summary: 预览五险逐项金额及待生成、跳过月份数量
      tags:
      - 后台 · 支付宝模拟业务
  /api/admin/alipay/schemas:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AlipaySchemasResponse'
      summary: 查询支付宝模拟业务类型及表单字段
      tags:
      - 后台 · 支付宝模拟业务
  /api/admin/app-package:
    get:
      description: 管理员Cookie鉴权。只返回版本、大小、SHA256和口令是否已设置，不回显口令。
      parameters:
      - description: 指定单个安装包；不传返回四项列表
        in: query
        name: app
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apkdownload.ListResponse'
      summary: 获取安装包管理信息
      tags:
      - 后台 · App安装包
  /api/admin/app-package/passcode:
    put:
      consumes:
      - application/json
      description: 管理员Cookie鉴权。5至64个Unicode字符，最多256个UTF8字节，支持中文和符号，不自动去掉空格。只保存SHA256预哈希后的bcrypt哈希，不回显；新下载请求立即使用新口令。保留审计但不记录口令。
      parameters:
      - description: 新的下载口令
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apkdownload.PasscodeRequest'
      - description: 安装包：nanwang/alipay/tax/ths
        in: query
        name: app
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apkdownload.InfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: 设置或修改APK下载口令
      tags:
      - 后台 · App安装包
  /api/admin/app-package/upload:
    post:
      consumes:
      - multipart/form-data
      description: 管理员Cookie鉴权，multipart/form-data，小于100MB。releaseKey由服务端按北京时间生成YYYYMMDDHHmmss，不接受客户端修改。默认下载口令eugenecoming，可通过专用接口修改。检查ZIP结构及Android二进制清单，不执行文件，不替代Android签名验证。上传失败保留当前版本，旧文件保留于持久化目录。
      parameters:
      - description: APK文件，小于100MB
        in: formData
        name: file
        required: true
        type: file
      - description: 安装包：nanwang/alipay/tax/ths
        in: query
        name: app
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apkdownload.InfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: 上传并替换当前APK
      tags:
      - 后台 · App安装包
  /api/admin/auth/login:
    post:
      consumes:
      - application/json
      description: 同IP滚动一分钟最多5次登录请求，第6次冻结10分钟；同管理员滚动一分钟3次失败冻结10分钟，跨IP累计且成功后清零。冻结期间不延长冻结，不影响已登录会话。429返回Retry-After秒数。计数落库，重启后保留。成功设置HttpOnly会话Cookie。
      parameters:
      - description: 管理员账号密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: 管理员登录
      tags:
      - 后台 · 管理员认证
  /api/admin/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 管理员退出登录
      tags:
      - 后台 · 管理员认证
  /api/admin/auth/me:
    get:
      description: 使用管理员登录接口设置的会话Cookie验证身份。
      produces:
