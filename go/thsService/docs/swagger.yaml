  /v1/tax-user/company/list:
    post:
      description: POST查询，沿用会员Bearer Token，不传用户ID，仅本人可读。成功code=1/msg/data；每会员一条记录，data为单元素数组，字段company_name、tax_id、company_num、post、start_date、end_date。有记录读库，缺失生成保存；end_date为空表示在职，日期YYYY-MM-DD。删除后App再次查询重新生成。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tax.AppEmploymentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: 获取本人任职受雇单位，缺失时生成保存
      tags:
      - App端 · 所得税任职单位
  /v1/tax-user/info:
    post:
      description: POST查询，使用现有会员Bearer Token，不传用户ID，App只能读本人。成功code=1/msg/data，使用card_type、id_card、tax_number、tax_back_money等文档下划线字段。资料独立存表，与会员一对一；有记录读库，缺失生成保存。tax_back_money为2019至2023五项逗号分隔金额，其他年份展示第五项。资料不修改会员账号，删除后App再次读取重新生成。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tax.AppProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: 获取本人所得税资料，缺失时自动生成保存
      tags:
      - App端 · 所得税个人资料
  /v1/tax-user/openRecord/info:
    post:
      consumes:
      - application/json
      description: yzm取二维码-=后部分，与后台开具记录验证码一致。仅查询本人，缺失集合先生成模拟记录，验证码无匹配code=0；正确验证码返回images_data，可为空。不生成图片或二维码。
      parameters:
      - description: 扫码验证码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/taxbusiness.ScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/taxbusiness.ScanResponse'
      security:
      - BearerAuth: []
      summary: 用验证码查询本人的开具记录图片地址
      tags:
      - App端 · 所得税业务
  /v1/tax-user/openRecord/list:
    post:
      consumes:
      - application/json
      description: 无记录生成2条，有记录读库。create_time为YYYY-MM-DD HH:mm:ss字符串（按本项目约定，不是Unix时间戳），images_data初始为空，后台可填写URL，暂不生成任何图片。验证码只在后台维护，不在列表公开。
      parameters:
      - description: 空对象
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/taxbusiness.EmptyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/taxbusiness.OpenRecordsResponse'
      security:
      - BearerAuth: []
      summary: 查询本人模拟纳税记录开具列表
      tags:
      - App端 · 所得税业务
  /v1/tax-user/taxCountInfo:
    post:
      consumes:
      - application/json
      description: date为YYYY-MM，type默认正常工资薪金。该年份月度记录缺失时生成，已有时读库；累计值汇总至指定月份，本期税额和detail_list来自对应月度记录。后台修改月度明细及扣除字段即可同步修改此接口，不维护第二份可冲突金额。rate为模拟展示10%，非真实税务计算。
      parameters:
      - description: 所属期和所得小类
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/taxbusiness.CalculateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/taxbusiness.CalculationResponse'
      security:
      - BearerAuth: []
      summary: 查询本人指定月份及所得小类的模拟计算明细
      tags:
      - App端 · 所得税业务
  /v1/tax-user/taxMsg/list:
    post:
      consumes:
      - application/json
      description: 无记录生成15条并保存，有记录读库。page从1开始，limit为1至100，count是消息总条数。条目返回id/title/content/create_time。
      parameters:
      - description: 分页参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/taxbusiness.MessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/taxbusiness.MessagesContract'
      security:
      - BearerAuth: []
      summary: 分页查询本人模拟税务消息
      tags:
      - App端 · 所得税业务
  /v1/tax-user/taxYear/list:
    post:
      consumes:
      - application/json
      description: year支持数字或字符串，2019至当前年份。历史年份生成12个月，当前年份生成截至当前月；已有记录不补齐。金额为字符串，全年合计由数据库月度记录汇总。全部数据仅模拟展示。
      parameters:
      - description: 纳税年度
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/taxbusiness.YearRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/taxbusiness.AnnualContract'
      security:
      - BearerAuth: []
      summary: 查询本人年度收入纳税明细，缺失生成保存
      tags:
      - App端 · 所得税业务
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer 加一个空格，再输入登录返回的 accessToken
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
