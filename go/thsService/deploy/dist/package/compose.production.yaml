name: ths-service

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ths
      MYSQL_USER: ths_service
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p"$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - backend
    command:
      - -path=/migrations
      - -database=mysql://ths_service:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/ths?multiStatements=true
      - up

  api:
    image: ths-service-api:latest
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      THS_DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      THS_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      THS_APP_ENVIRONMENT: ${THS_APP_ENVIRONMENT:-testing}
      THS_SWAGGER_ENABLED: ${THS_SWAGGER_ENABLED:-true}
    expose:
      - "9527"
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9527/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/cloudflare:/etc/nginx/certs:ro
    networks:
      - frontend
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  mysql_data:
