<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>App下载</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#202d40;font-family:system-ui,sans-serif}.card{max-width:480px;margin:8vh auto;padding:32px;background:white;border-radius:18px;box-shadow:0 8px 35px #22335512}h1{margin-top:0}label{display:block;margin:20px 0 8px}input,button{width:100%;padding:14px;border-radius:8px;font:inherit}input{border:1px solid #b9c3d1}button{margin-top:18px;background:#1769e0;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{margin-top:18px;overflow-wrap:anywhere}small{color:#57677d}@media(max-width:520px){.card{margin:24px 16px;padding:24px}}
