server:
  # 网关服务端口。
  port: ${GATEWAY_PORT:8000}

gateway:
  cors:
    # 局域网测试默认允许 localhost、127.0.0.1 和常见私网网段来源。
    # 注意：浏览器访问 80 端口时，Origin 通常是不带 :80 的，例如 http://192.168.1.104。
    # 生产环境请通过 GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS 收窄为真实前端域名。
    allowed-origin-patterns: ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*,http://192.168.*,http://192.168.*:*,http://10.*,http://10.*:*,http://172.*,http://172.*:*}

spring:
  application:
    # 注册到 Nacos 的服务名。
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  cloud:
    nacos:
      discovery:
        # Nacos 服务发现地址。
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

    gateway:
      server:
        webflux:
          # 网关路由配置，请求会按 Path 断言转发到对应服务。
          routes:
#            # user-service Swagger 文档路由，当前未启用。
#            - id: user-service-swagger
#              uri: lb://user-service
#              predicates:
#              - Path=/api/user/swagger-ui/**,/api/user/v3/api-docs/**
#              filters:
#              - StripPrefix=2
#            # match-service Swagger 文档路由，当前未启用。
#            - id: match-service-swagger
#              uri: lb://match-service
#              predicates:
#              - Path=/api/soccer/swagger-ui/**,/api/soccer/v3/api-docs/**
#              filters:
#              - StripPrefix=2
            # 用户服务路由，/api/user/** 转发到 user-service，并去掉第一段路径。
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
            # 比赛服务路由，/api/soccer/** 转发到 match-service，并去掉第一段路径。
            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/soccer/**
              filters:
                - StripPrefix=1
            # 订单服务路由，/api/order/** 转发到 order-service，并去掉第一段路径。
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=1
            # 后台管理服务路由，/admin/** 转发到 admin-service。
            - id: admin-service
              uri: lb://admin-service
              predicates:
                - Path=/admin/**
