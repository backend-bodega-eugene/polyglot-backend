services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: goalhub-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
      NACOS_AUTH_IDENTITY_KEY: "nacos"
      NACOS_AUTH_IDENTITY_VALUE: "nacos"
      TZ: Asia/Bangkok
    expose:
      - "8080"
      - "8848"
      - "9848"
      - "9849"
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
    networks:
      - goalhub-net

  mysql:
    image: mysql:8.4
    container_name: goalhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: goalhub_user
      MYSQL_USER: goalhub
      MYSQL_PASSWORD: goalhub123456
      TZ: Asia/Bangkok
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    networks:
      - goalhub-net

  mongodb:
    image: mongo:8.0
    container_name: goalhub-mongodb
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123456
    expose:
      - "27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - goalhub-net

  redis:
    image: redis:7.2
    container_name: goalhub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    networks:
      - goalhub-net

  gateway-service:
    image: eclipse-temurin:21-jre
    container_name: goalhub-gateway
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./jars/gateway-service.jar:/app/app.jar
      - ./config/gateway-service:/app/config
    environment:
      TZ: Asia/Bangkok
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:/app/config/"]
    expose:
      - "8000"
    depends_on:
      - nacos
      - redis
    networks:
      - goalhub-net

  user-service:
    image: eclipse-temurin:21-jre
    container_name: goalhub-user
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./jars/user-service.jar:/app/app.jar
      - ./config/user-service:/app/config
    environment:
      TZ: Asia/Bangkok
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:/app/config/"]
    expose:
      - "9001"
    depends_on:
      - nacos
      - mysql
      - redis
      - mongodb
    networks:
      - goalhub-net

  match-service:
    image: eclipse-temurin:21-jre
    container_name: goalhub-match
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./jars/match-service.jar:/app/app.jar
      - ./config/match-service:/app/config
    environment:
      TZ: Asia/Bangkok
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:/app/config/"]
    expose:
      - "9002"
    depends_on:
      - nacos
      - mysql
      - redis
      - mongodb
    networks:
      - goalhub-net

  admin-service:
    image: eclipse-temurin:21-jre
    container_name: goalhub-admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./jars/admin-service.jar:/app/app.jar
      - ./config/admin-service:/app/config
    environment:
      TZ: Asia/Bangkok
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:/app/config/"]
    expose:
      - "9003"
    depends_on:
      - nacos
      - mysql
      - redis
      - mongodb
    networks:
      - goalhub-net

  order-service:
    image: eclipse-temurin:21-jre
    container_name: goalhub-order
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./jars/order-service.jar:/app/app.jar
      - ./config/order-service:/app/config
    environment:
      TZ: Asia/Bangkok
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:/app/config/"]
    expose:
      - "9004"
    depends_on:
      - nacos
      - mysql
      - redis
      - mongodb
    networks:
      - goalhub-net

  nginx:
    image: nginx:1.27
    container_name: goalhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/html/h5:/usr/share/nginx/html/h5
      - ./nginx/html/admin:/usr/share/nginx/html/admin
    depends_on:
      - gateway-service
    networks:
      - goalhub-net

networks:
  goalhub-net:
    driver: bridge