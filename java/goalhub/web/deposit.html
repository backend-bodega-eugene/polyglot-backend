<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>GoalHub | 充值订单</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <link rel="preload" href="css/adminlte.css" as="style" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <script src="js/auth.js"></script>
    <style>
        .app-sidebar .sidebar-menu .nav-link { display: flex; align-items: center; }
        .app-sidebar .sidebar-menu .nav-link p { margin: 0 0 0 .5rem; white-space: nowrap; }
        .fund-table { min-width: 1500px; }
        .fund-table th,
        .fund-table td { white-space: nowrap; vertical-align: middle; }
        .order-no { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
        .order-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
        .detail-value { white-space: pre-wrap; word-break: break-word; }
        #audit-modal .modal-dialog { max-height: calc(100vh - 1rem); }
        #audit-modal .modal-content { max-height: calc(100vh - 1rem); }
        #audit-modal .modal-body { overflow-y: auto; }
        #audit-modal .modal-footer { position: sticky; bottom: 0; z-index: 2; background: var(--bs-modal-bg); }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a></li></ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" data-lte-toggle="fullscreen"><i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i><i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i></a></li>
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"><img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow" alt="用户头像" /><span id="user-name" class="d-none d-md-inline">管理员</span></a>
                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                            <li class="user-header text-bg-primary"><img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow" alt="用户头像" /><p id="user-title">管理员 - Admin<small id="user-since">今日登录</small></p></li>
                            <li class="user-footer d-flex gap-2"><a id="btn-profile" href="profile.html" class="btn btn-default btn-flat flex-fill">个人资料</a><button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand"><a href="index.html" class="brand-link"><img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" /><span class="brand-text fw-light">GoalHub</span></a></div>
            <div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column sidebar-menu" data-lte-toggle="treeview" role="menu" aria-label="主导航" data-accordion="false" id="navigation"></ul></nav></div>
        </aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex align-items-center justify-content-between">
                                    <h3 class="card-title mb-0"><i class="bi bi-cash-coin me-2"></i>充值订单</h3>
                                    <button class="btn btn-outline-secondary btn-sm" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button>
                                </div>
                                <div class="card-body">
                                    <form id="filter-form" class="row g-2">
                                        <div class="col-6 col-md-2"><label class="form-label">用户 ID</label><input type="number" class="form-control" id="f-userId" min="1"></div>
                                        <div class="col-12 col-md-3"><label class="form-label">订单号</label><input type="text" class="form-control" id="f-orderNo"></div>
                                        <div class="col-6 col-md-2"><label class="form-label">币种</label><input type="text" class="form-control" id="f-currencyCode" placeholder="USDT"></div>
                                        <div class="col-6 col-md-2"><label class="form-label">状态</label><select class="form-select" id="f-status"><option value="">全部</option><option value="PENDING">待审核</option><option value="APPROVED">已通过</option><option value="REJECTED">已拒绝</option></select></div>
                                        <div class="col-6 col-md-2"><label class="form-label">链类型</label><input type="text" class="form-control" id="f-chainType" placeholder="TRC20"></div>
                                        <div class="col-12 col-md-3"><label class="form-label">TxHash</label><input type="text" class="form-control" id="f-txHash"></div>
                                        <div class="col-6 col-md-1"><label class="form-label">每页</label><select class="form-select" id="f-pageSize"><option>10</option><option>20</option><option>50</option><option>100</option></select></div>
                                        <div class="col-6 col-md-2 d-flex align-items-end"><button type="submit" class="btn btn-dark w-100"><i class="bi bi-search me-1"></i>查询</button></div>
                                        <div class="col-6 col-md-2 d-flex align-items-end"><button type="button" class="btn btn-outline-secondary w-100" id="btn-reset"><i class="bi bi-x-circle me-1"></i>重置</button></div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="card">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover table-striped mb-0 fund-table">
                                            <thead class="table-light">
                                                <tr>
                                                    <th>ID</th><th>订单号</th><th>用户ID</th><th>币种</th><th>金额</th><th>到账金额</th><th>状态</th><th>链类型</th><th>TxHash</th><th>审核时间</th><th>创建时间</th><th class="text-end pe-3">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="orders-tbody"><tr><td colspan="12" class="text-center py-4">加载中...</td></tr></tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer"><div class="d-flex justify-content-between align-items-center"><div><span id="orders-total">0</span> 条记录</div><nav><ul class="pagination pagination-sm mb-0" id="orders-pager"></ul></nav></div></div>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="audit-modal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content"><form id="audit-form">
                            <div class="modal-header"><h5 class="modal-title" id="audit-title">充值订单审核</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
                            <div class="modal-body">
                                <input type="hidden" id="audit-id">
                                <div class="row g-3">
                                    <div class="col-md-4"><label class="form-label">订单号</label><div class="form-control detail-value bg-body-tertiary" id="d-orderNo"></div></div>
                                    <div class="col-md-2"><label class="form-label">用户ID</label><div class="form-control bg-body-tertiary" id="d-userId"></div></div>
                                    <div class="col-md-2"><label class="form-label">币种</label><div class="form-control bg-body-tertiary" id="d-currencyCode"></div></div>
                                    <div class="col-md-2"><label class="form-label">金额</label><div class="form-control bg-body-tertiary" id="d-amount"></div></div>
                                    <div class="col-md-2"><label class="form-label">到账金额</label><div class="form-control bg-body-tertiary" id="d-actualAmount"></div></div>
                                    <div class="col-md-2"><label class="form-label">状态</label><div class="form-control bg-body-tertiary" id="d-status"></div></div>
                                    <div class="col-md-2"><label class="form-label">链类型</label><div class="form-control bg-body-tertiary" id="d-chainType"></div></div>
                                    <div class="col-md-8"><label class="form-label">TxHash</label><div class="form-control detail-value bg-body-tertiary" id="d-txHash"></div></div>
                                    <div class="col-md-3"><label class="form-label">审核结果</label><select class="form-select" id="audit-status"><option value="">请选择</option><option value="APPROVED">通过</option><option value="REJECTED">拒绝</option></select></div>
                                    <div class="col-12"><label class="form-label">审核备注</label><textarea class="form-control" id="audit-remark" rows="3"></textarea></div>
                                    <div class="col-12"><label class="form-label">用户备注</label><div class="form-control detail-value bg-body-tertiary" id="d-remark" style="min-height: 72px;"></div></div>
                                    <div class="col-12"><label class="form-label">历史审核备注</label><div class="form-control detail-value bg-body-tertiary" id="d-auditRemark" style="min-height: 72px;"></div></div>
                                    <div class="col-md-3"><label class="form-label">审核人</label><div class="form-control bg-body-tertiary" id="d-auditAdmin"></div></div>
                                    <div class="col-md-3"><label class="form-label">审核时间</label><div class="form-control bg-body-tertiary" id="d-auditTime"></div></div>
                                    <div class="col-md-3"><label class="form-label">创建时间</label><div class="form-control bg-body-tertiary" id="d-createdAt"></div></div>
                                    <div class="col-md-3"><label class="form-label">更新时间</label><div class="form-control bg-body-tertiary" id="d-updatedAt"></div></div>
                                </div>
                            </div>
                            <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">关闭</button><button class="btn btn-primary" type="submit" id="btn-audit-save"><i class="bi bi-check2-circle me-1"></i>提交审核</button></div>
                        </form></div></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer"><div class="float-end d-none d-sm-inline">GoalHub 管理后台</div><strong>Copyright &copy; 2026&nbsp;<span class="text-decoration-none">GoalHub</span>.</strong> All rights reserved.</footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="./js/adminlte.js"></script>
    <script src="./js/page-common.js"></script>
    <script>window.GoalHubFundOrderConfig = { kind: 'deposit', title: '充值订单审核', apiBase: '/admin/depositorder', colspan: 12 };</script>
    <script src="./js/fund-order-page.js"></script>
</body>

</html>
