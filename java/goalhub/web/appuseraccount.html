<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>GoalHub | 用户账户管理</title>

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="title" content="GoalHub | 用户账户管理" />
    <meta name="author" content="GoalHub" />
    <meta name="description" content="GoalHub 管理后台" />
    <meta name="keywords" content="goalhub, admin" />
    <meta name="supported-color-schemes" content="light dark" />
    <link rel="preload" href="css/adminlte.css" as="style" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
        integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous" media="print"
        onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <script src="js/auth.js"></script>
    <style>
        .app-sidebar .sidebar-menu .nav-link {
            display: flex;
            align-items: center;
        }

        .app-sidebar .sidebar-menu .nav-link p {
            margin: 0 0 0 .5rem;
            white-space: nowrap;
        }

        .money-cell {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-lte-toggle="fullscreen">
                            <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
                            <i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i>
                        </a>
                    </li>
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                            <img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow"
                                alt="用户头像" />
                            <span id="user-name" class="d-none d-md-inline">管理员</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                            <li class="user-header text-bg-primary">
                                <img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow"
                                    alt="用户头像" />
                                <p id="user-title">
                                    管理员 - Admin
                                    <small id="user-since">今日登录</small>
                                </p>
                            </li>
                            <li class="user-footer d-flex gap-2">
                                <a id="btn-profile" href="profile.html"
                                    class="btn btn-default btn-flat flex-fill">个人资料</a>
                                <button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>

        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand">
                <a href="index.html" class="brand-link">
                    <img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" />
                    <span class="brand-text fw-light">GoalHub</span>
                </a>
            </div>
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column sidebar-menu" data-lte-toggle="treeview"
                        role="menu" aria-label="主导航" data-accordion="false" id="navigation"></ul>
                </nav>
            </div>
        </aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row g-3" id="account-page">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex align-items-center justify-content-between">
                                    <h3 class="card-title mb-0"><i class="bi bi-wallet2 me-2"></i>用户账户管理</h3>
                                    <button class="btn btn-outline-secondary btn-sm" id="btn-refresh">
                                        <i class="bi bi-arrow-clockwise me-1"></i>刷新
                                    </button>
                                </div>
                                <div class="card-body">
                                    <form id="filter-form" class="row g-2">
                                        <div class="col-12 col-md-2">
                                            <label class="form-label">用户名</label>
                                            <input type="text" class="form-control" id="f-username" placeholder="用户名">
                                        </div>
                                        <div class="col-12 col-md-2">
                                            <label class="form-label">币种</label>
                                            <input type="text" class="form-control" id="f-currency" placeholder="CNY / USD">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">最小余额</label>
                                            <input type="number" step="0.01" class="form-control" id="f-min-balance">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">最大余额</label>
                                            <input type="number" step="0.01" class="form-control" id="f-max-balance">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">状态</label>
                                            <select class="form-select" id="f-status">
                                                <option value="">全部</option>
                                                <option value="1">启用</option>
                                                <option value="0">禁用</option>
                                            </select>
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">每页</label>
                                            <select class="form-select" id="f-pageSize">
                                                <option>10</option>
                                                <option>20</option>
                                                <option>50</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-3">
                                            <label class="form-label">用户创建开始时间</label>
                                            <input type="datetime-local" class="form-control" id="f-created-start">
                                        </div>
                                        <div class="col-12 col-md-3">
                                            <label class="form-label">用户创建结束时间</label>
                                            <input type="datetime-local" class="form-control" id="f-created-end">
                                        </div>
                                        <div class="col-12 col-md-3 d-flex align-items-end">
                                            <button type="submit" class="btn btn-dark w-100">
                                                <i class="bi bi-search me-1"></i>查询
                                            </button>
                                        </div>
                                        <div class="col-12 col-md-3 d-flex align-items-end">
                                            <button type="button" class="btn btn-outline-secondary w-100" id="btn-reset">
                                                <i class="bi bi-x-circle me-1"></i>重置
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="card">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover table-striped mb-0 align-middle">
                                            <thead class="table-light">
                                                <tr>
                                                    <th style="width: 90px;">账户ID</th>
                                                    <th>用户名</th>
                                                    <th style="width: 110px;">币种</th>
                                                    <th style="width: 140px;">余额</th>
                                                    <th style="width: 140px;">冻结余额</th>
                                                    <th style="width: 90px;">状态</th>
                                                    <th style="width: 170px;">用户创建时间</th>
                                                    <th style="width: 170px;">更新时间</th>
                                                    <th style="width: 260px;" class="text-end pe-3">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="accounts-tbody">
                                                <tr>
                                                    <td colspan="9" class="text-center py-4">加载中...</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div><span id="accounts-total">0</span> 条记录</div>
                                        <nav>
                                            <ul class="pagination pagination-sm mb-0" id="accounts-pager"></ul>
                                        </nav>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="balance-modal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <form id="balance-form">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="balance-modal-title">调整余额</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="关闭"></button>
                                    </div>
                                    <div class="modal-body">
                                        <input type="hidden" id="b-account-id">
                                        <input type="hidden" id="b-op">
                                        <div class="mb-3">
                                            <label class="form-label">账户</label>
                                            <input type="text" class="form-control" id="b-account-label" disabled>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">金额<span class="text-danger">*</span></label>
                                            <input type="number" step="0.01" min="0.01" class="form-control" id="b-amount" required>
                                        </div>
                                        <div>
                                            <label class="form-label">备注</label>
                                            <textarea class="form-control" id="b-remark" rows="3" placeholder="请输入调整原因"></textarea>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">取消</button>
                                        <button class="btn btn-primary" type="submit">
                                            <i class="bi bi-check2-circle me-1"></i>确认
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="float-end d-none d-sm-inline">GoalHub 管理后台</div>
            <strong>Copyright &copy; 2026&nbsp;<span class="text-decoration-none">GoalHub</span>.</strong> All rights reserved.
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
        crossorigin="anonymous"></script>
    <script src="./js/adminlte.js"></script>
    <script src="./js/page-common.js"></script>

    <script>
        (function () {
            const auth = window.GoalHubAuth;
            const API = '/admin/account';
            const state = { pageIndex: 1, pageSize: 10, total: 0, list: [], filters: {} };

            const $tbody = document.getElementById('accounts-tbody');
            const $pager = document.getElementById('accounts-pager');
            const $total = document.getElementById('accounts-total');
            const $form = document.getElementById('filter-form');
            const $reset = document.getElementById('btn-reset');
            const $refresh = document.getElementById('btn-refresh');
            const $fUsername = document.getElementById('f-username');
            const $fCurrency = document.getElementById('f-currency');
            const $fMinBalance = document.getElementById('f-min-balance');
            const $fMaxBalance = document.getElementById('f-max-balance');
            const $fStatus = document.getElementById('f-status');
            const $fPageSize = document.getElementById('f-pageSize');
            const $fCreatedStart = document.getElementById('f-created-start');
            const $fCreatedEnd = document.getElementById('f-created-end');

            const balanceModal = new bootstrap.Modal(document.getElementById('balance-modal'));
            const $balanceForm = document.getElementById('balance-form');
            const $balanceTitle = document.getElementById('balance-modal-title');
            const $bAccountId = document.getElementById('b-account-id');
            const $bOp = document.getElementById('b-op');
            const $bAccountLabel = document.getElementById('b-account-label');
            const $bAmount = document.getElementById('b-amount');
            const $bRemark = document.getElementById('b-remark');

            const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            const ok = (data) => data && (data.code === 200 || data.code === 0 || data.success === true);
            const messageOf = (data, fallback) => data?.message || data?.msg || fallback;

            function fmtTime(value) {
                if (!value) return '-';
                const date = new Date(String(value));
                return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
            }

            function fmtMoney(value) {
                if (value === null || value === undefined || value === '') return '-';
                const num = Number(value);
                return Number.isFinite(num) ? num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 8 }) : String(value);
            }

            function isoFromLocal(value) {
                if (!value) return '';
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? '' : date.toISOString();
            }

            function numberOrEmpty(value) {
                if (value === '') return '';
                const num = Number(value);
                return Number.isFinite(num) ? num : '';
            }

            async function request(url, options = {}) {
                const res = await auth.authFetch(url, options);
                const text = await res.text();
                let data = {};
                if (text) {
                    try {
                        data = JSON.parse(text);
                    } catch (_) {
                        if (res.ok) return {};
                        throw new Error('接口返回格式错误');
                    }
                }
                if (!text && res.ok) return data;
                if (!res.ok || !ok(data)) throw new Error(messageOf(data, '请求失败'));
                return data;
            }

            function readFilters() {
                return {
                    username: $fUsername.value.trim(),
                    currencyCode: $fCurrency.value.trim(),
                    minBalance: numberOrEmpty($fMinBalance.value),
                    maxBalance: numberOrEmpty($fMaxBalance.value),
                    status: $fStatus.value === '' ? '' : Number($fStatus.value),
                    userCreatedStartTime: isoFromLocal($fCreatedStart.value),
                    userCreatedEndTime: isoFromLocal($fCreatedEnd.value),
                };
            }

            function buildPageBody() {
                const body = { pageIndex: state.pageIndex, pageSize: state.pageSize };
                Object.entries(state.filters).forEach(([key, value]) => {
                    if (value !== '' && value !== null && value !== undefined) body[key] = value;
                });
                return body;
            }

            function extractPage(data) {
                const page = data.data || data.result || data || {};
                const records = page.records || page.list || page.rows || page.data || [];
                const rawPageIndex = page.pageIndex ?? page.current ?? page.pageNum;
                const nextPageIndex = rawPageIndex === undefined ? state.pageIndex : Number(rawPageIndex) + 1;
                return {
                    list: Array.isArray(records) ? records : [],
                    total: Math.max(Number(page.total || page.totalCount || 0), Array.isArray(records) ? records.length : 0),
                    pageIndex: Number.isFinite(nextPageIndex) ? nextPageIndex : state.pageIndex,
                    pageSize: Number(page.pageSize || page.size || state.pageSize),
                };
            }

            async function apiList() {
                const data = await request(`${API}/page`, {
                    method: 'POST',
                    body: JSON.stringify(buildPageBody()),
                });
                return extractPage(data);
            }

            function apiUpdateStatus(accountId, status) {
                return request(`${API}/updatestatus`, {
                    method: 'POST',
                    body: JSON.stringify({ accountId: Number(accountId), status }),
                });
            }

            function apiBalance(op, accountId, amount, remark) {
                return request(`${API}/${op === 'add' ? 'addbalance' : 'subbalance'}`, {
                    method: 'POST',
                    body: JSON.stringify({ accountId: Number(accountId), amount: Number(amount), remark }),
                });
            }

            function accountIdOf(row) {
                return row.accountId ?? row.id ?? row.account_id ?? '';
            }

            function usernameOf(row) {
                return row.username ?? row.userName ?? row.appUsername ?? row.user?.username ?? '';
            }

            function renderRows(list) {
                if (!list || list.length === 0) {
                    $tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-muted">暂无数据</td></tr>`;
                    return;
                }

                $tbody.innerHTML = list.map((x) => {
                    const id = accountIdOf(x);
                    const status = Number(x.status ?? 1);
                    const currency = x.currencyCode ?? x.currency ?? '';
                    return `
        <tr data-id="${esc(id)}">
          <td>${esc(id)}</td>
          <td>${esc(usernameOf(x))}</td>
          <td><span class="badge bg-info">${esc(currency || '-')}</span></td>
          <td class="money-cell">${esc(fmtMoney(x.balance ?? x.availableBalance ?? x.amount))}</td>
          <td class="money-cell">${esc(fmtMoney(x.frozenBalance ?? x.freezeBalance ?? x.lockedBalance))}</td>
          <td>${status === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>'}</td>
          <td>${esc(fmtTime(x.userCreatedTime || x.userCreatedAt || x.userCreateTime || x.createdAt || x.createTime))}</td>
          <td>${esc(fmtTime(x.updatedAt || x.updateTime))}</td>
          <td class="text-end pe-3">
            <button class="btn btn-outline-success btn-sm me-1" data-op="add">加款</button>
            <button class="btn btn-outline-warning btn-sm me-1" data-op="sub">扣款</button>
            <button class="btn btn-outline-secondary btn-sm" data-op="status">${status === 1 ? '禁用' : '启用'}</button>
          </td>
        </tr>`;
                }).join('');
            }

            function renderPager() {
                const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
                const cur = Math.min(Math.max(1, state.pageIndex), pages);
                const item = (p, txt, disabled = false, active = false) =>
                    `<li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}"><a href="#" class="page-link" data-page="${p}">${txt}</a></li>`;
                const items = [item(cur - 1, '&laquo;', cur <= 1)];
                const start = Math.max(1, cur - 3);
                const end = Math.min(pages, start + 6);
                for (let p = start; p <= end; p++) items.push(item(p, p, false, p === cur));
                items.push(item(cur + 1, '&raquo;', cur >= pages));
                $pager.innerHTML = items.join('');
                $total.textContent = state.total;
            }

            async function reload() {
                try {
                    $tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4">加载中...</td></tr>`;
                    const page = await apiList();
                    state.list = page.list;
                    state.total = page.total;
                    state.pageIndex = page.pageIndex;
                    state.pageSize = page.pageSize;
                    renderRows(state.list);
                    renderPager();
                } catch (error) {
                    console.error(error);
                    $tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-danger">${esc(error.message || '加载失败')}</td></tr>`;
                }
            }

            function findRow(id) {
                return state.list.find((x) => String(accountIdOf(x)) === String(id));
            }

            $form.addEventListener('submit', (e) => {
                e.preventDefault();
                state.filters = readFilters();
                state.pageSize = Number($fPageSize.value || 10);
                state.pageIndex = 1;
                reload();
            });

            $reset.addEventListener('click', () => {
                $form.reset();
                $fPageSize.value = String(state.pageSize);
                state.filters = {};
                state.pageIndex = 1;
                reload();
            });

            $refresh.addEventListener('click', reload);

            $pager.addEventListener('click', (e) => {
                const a = e.target.closest('a[data-page]');
                if (!a) return;
                e.preventDefault();
                const page = Number(a.dataset.page);
                if (!Number.isFinite(page) || page < 1 || page === state.pageIndex) return;
                state.pageIndex = page;
                reload();
            });

            $tbody.addEventListener('click', async (e) => {
                const btn = e.target.closest('button[data-op]');
                if (!btn) return;
                const id = btn.closest('tr')?.dataset?.id;
                const row = findRow(id);
                if (!row) return;

                if (btn.dataset.op === 'status') {
                    const nextStatus = Number(row.status ?? 1) === 1 ? 0 : 1;
                    if (!confirm(`确定要${nextStatus === 1 ? '启用' : '禁用'}该账户吗？`)) return;
                    try {
                        await apiUpdateStatus(id, nextStatus);
                        await reload();
                    } catch (error) {
                        alert(error.message || '状态修改失败');
                    }
                    return;
                }

                const isAdd = btn.dataset.op === 'add';
                $balanceForm.reset();
                $bAccountId.value = id;
                $bOp.value = isAdd ? 'add' : 'sub';
                $bAccountLabel.value = `${usernameOf(row) || '-'} / ${row.currencyCode || row.currency || '-'} / #${id}`;
                $balanceTitle.textContent = isAdd ? '增加用户余额' : '减去用户余额';
                balanceModal.show();
            });

            $balanceForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const amount = Number($bAmount.value);
                if (!Number.isFinite(amount) || amount <= 0) {
                    alert('请输入大于 0 的金额');
                    return;
                }
                try {
                    await apiBalance($bOp.value, $bAccountId.value, amount, $bRemark.value.trim());
                    balanceModal.hide();
                    await reload();
                } catch (error) {
                    alert(error.message || '余额调整失败');
                }
            });

            $fPageSize.value = String(state.pageSize);
            state.filters = readFilters();
            reload();
        })();
    </script>
</body>

</html>
