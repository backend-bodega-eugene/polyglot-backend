<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>GoalHub | 个人资料</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="./css/adminlte.css" as="style" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
        crossorigin="anonymous" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .app-sidebar .sidebar-menu .nav-link {
            display: flex;
            align-items: center;
        }

        .app-sidebar .sidebar-menu .nav-link p {
            margin: 0 0 0 .5rem;
            white-space: nowrap;
        }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-lte-toggle="fullscreen">
                            <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
                            <i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i>
                        </a>
                    </li>
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                            <img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow"
                                alt="用户头像" />
                            <span id="user-name" class="d-none d-md-inline">管理员</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                            <li class="user-header text-bg-primary">
                                <img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow"
                                    alt="用户头像" />
                                <p id="user-title">
                                    管理员 - Admin
                                    <small id="user-since">今日登录</small>
                                </p>
                            </li>
                            <li class="user-footer d-flex gap-2">
                                <a id="btn-profile" href="profile.html"
                                    class="btn btn-default btn-flat flex-fill">个人资料</a>
                                <button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand">
                <a href="index.html" class="brand-link">
                    <img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" />
                    <span class="brand-text fw-light">GoalHub</span>
                </a>
            </div>
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column sidebar-menu" data-lte-toggle="treeview"
                        role="menu" aria-label="主导航" data-accordion="false" id="navigation"></ul>
                </nav>
            </div>
        </aside>
        <main class="app-main">
            <div class="app-content">
                <div class="container-fluid">

                    <h3 class="mb-3">安全设置</h3>

                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">修改密码</h5>
                        </div>
                        <div class="card-body">
                            <form id="form-password" class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">当前密码</label>
                                    <input id="oldPwd" type="password" class="form-control"
                                        autocomplete="current-password" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">新密码</label>
                                    <input id="newPwd" type="password" class="form-control" autocomplete="new-password"
                                        required />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">确认新密码</label>
                                    <input id="newPwd2" type="password" class="form-control" autocomplete="new-password"
                                        required />
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-warning" id="btnChangePwd">
                                        <i class="bi bi-key-fill me-1"></i> 更新密码
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="toast align-items-center text-bg-success border-0 position-fixed bottom-0 end-0 m-3"
                        id="okToast" role="alert">
                        <div class="d-flex">
                            <div class="toast-body" id="okToastText">已保存</div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                data-bs-dismiss="toast"></button>
                        </div>
                    </div>
                    <div class="toast align-items-center text-bg-danger border-0 position-fixed bottom-0 end-0 m-3"
                        id="errToast" role="alert">
                        <div class="d-flex">
                            <div class="toast-body" id="errToastText">操作失败</div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                data-bs-dismiss="toast"></button>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="float-end d-none d-sm-inline">GoalHub 管理后台</div>
            <strong>Copyright &copy; 2026&nbsp;<span class="text-decoration-none">GoalHub</span>.</strong> All rights reserved.
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
        crossorigin="anonymous"></script>
    <script src="./js/adminlte.js"></script>
    <script>
        const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
        const Default = { scrollbarTheme: 'os-theme-light', scrollbarAutoHide: 'leave', scrollbarClickScroll: true };
        document.addEventListener('DOMContentLoaded', function () {
            const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
            if (sidebarWrapper && OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined) {
                OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                    scrollbars: { theme: Default.scrollbarTheme, autoHide: Default.scrollbarAutoHide, clickScroll: Default.scrollbarClickScroll },
                });
            }
        });
    </script>
    <script>
        (function () {
            const auth = window.GoalHubAuth;

            async function fetchMenus() {
                const res = await auth.authFetch('/admin/auth/menus');
                if (!res.ok) throw new Error('菜单加载失败');
                const data = await res.json();
                return Array.isArray(data) ? data : (data.data || []);
            }
            function renderMenus(menus) {
                const root = document.querySelector('aside.app-sidebar #navigation');
                if (!root) return; root.innerHTML = '';
                const createItem = (node) => {
                    const hasChildren = Array.isArray(node.children) && node.children.length > 0;
                    const li = document.createElement('li'); li.className = 'nav-item';
                    if (!hasChildren) {
                        const path = node.path || '#';
                        li.innerHTML = `
              <a href="${path}" class="nav-link${path !== '#' && location.pathname.endsWith('/' + path) ? ' active' : ''}">
                <i class="nav-icon ${node.icon || 'bi bi-speedometer'}"></i>
                <p>${node.name}</p>
              </a>`; return li;
                    }
                    li.innerHTML = `
            <a href="#" class="nav-link">
              <i class="nav-icon ${node.icon || 'bi bi-folder'}"></i>
              <p>${node.name} <i class="nav-arrow bi bi-chevron-right"></i></p>
            </a>`;
                    const ul = document.createElement('ul'); ul.className = 'nav nav-treeview';
                    node.children.forEach(ch => ul.appendChild(createItem(ch))); li.appendChild(ul); return li;
                };
                menus.forEach(m => root.appendChild(createItem(m)));
            }
            fetchMenus().then(m => { if (!m || m.length === 0) return; renderMenus(m); }).catch(e => console.warn(e));
        })();
    </script>
    <script>
        (function () {
            const auth = window.GoalHubAuth;

            const $name = document.getElementById('user-name');
            const $title = document.getElementById('user-title');
            const $since = document.getElementById('user-since');
            const $av1 = document.getElementById('user-avatar');
            const $av2 = document.getElementById('user-avatar-large');
            const $out = document.getElementById('btn-signout');

            function setProfile(p = {}) {
                const n = p.nickname || p.fullName || p.realName || p.username || '管理员';
                const role = Number(p.isSuperAdmin) === 1 ? 'Super Admin' : 'Admin';
                const sinceTxt = p.memberSince ? `登录时间 ${new Date(p.memberSince).toLocaleDateString()}` : '今日登录';
                if ($name) $name.textContent = n;
                if ($title) $title.innerHTML = `${n} - ${role} <small id="user-since">${sinceTxt}</small>`;
                if ($since) $since.textContent = sinceTxt;
                const avatar = p.avatarUrl || p.avatar || 'assets/img/default-avatar.jpg';
                if ($av1) $av1.src = avatar;
                if ($av2) $av2.src = avatar;
            }

            async function loadProfile() {
                setProfile(auth.getAdminUser() || {});
            }

            $out?.addEventListener('click', () => {
                auth.toLogin();
            });

            loadProfile();
        })();
    </script>
    <script>
        (function () {
            document.getElementById('form-password')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPwd = document.getElementById('newPwd').value;
                const newPwd2 = document.getElementById('newPwd2').value;
                if (newPwd !== newPwd2) { alert('两次输入的新密码不一致'); return; }
                document.getElementById('errToastText').textContent = '修改个人密码接口暂未接入';
                new bootstrap.Toast(document.getElementById('errToast')).show();
            });
        })();
    </script>
</body>

</html>
