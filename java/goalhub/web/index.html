<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">

            </a>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="#" data-lte-toggle="fullscreen">
              <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
              <i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i>
            </a>
          </li>
          <li class="nav-item dropdown user-menu">
            <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
              <img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow" alt="用户头像" />

            <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
              <li class="user-header text-bg-primary">
                <img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow" alt="用户头像" />
                <p id="user-title">
                  管理员 - Admin
                  <small id="user-since">今日登录</small>
                </p>
              </li>
              <li class="user-footer d-flex gap-2">
                <a id="btn-profile" href="profile.html" class="btn btn-default btn-flat flex-fill">个人资料</a>
                <button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button>
              </li>
            </ul>
          </li>

        </ul>
      </div>
    </nav>
    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
      <div class="sidebar-brand">
        <a href="index.html" class="brand-link">
          <img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" />

        <nav class="mt-2">

            aria-label="主导航" data-accordion="false" id="navigation">

    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">

        </div>
      </div>
      <div class="app-content">
        <div class="container-fluid">

        </div>
      </div>

    <footer class="app-footer">
      <div class="float-end d-none d-sm-inline">GoalHub 管理后台</div>

    </footer>

  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="./js/adminlte.js"></script>

  <script>
    const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
    const Default = { scrollbarTheme: 'os-theme-light', scrollbarAutoHide: 'leave', scrollbarClickScroll: true };
    document.addEventListener('DOMContentLoaded', function () {
      const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
      if (sidebarWrapper && OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined) {
        OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
          scrollbars: { theme: Default.scrollbarTheme, autoHide: Default.scrollbarAutoHide, clickScroll: Default.scrollbarClickScroll },
        });
      }
    });
  </script>
  <script>
    (function () {
      const auth = window.GoalHubAuth;
      const LOGIN_PAGE = 'login.html';

      function getToken() { return auth.getToken(); }
      const token = getToken();
      if (!token) { location.href = LOGIN_PAGE; return; }

      async function fetchMenus() {
        const res = await auth.authFetch('/admin/auth/menus');
        if (!res.ok) throw new Error('菜单加载失败');
        const data = await res.json();
        return Array.isArray(data) ? data : (data.data || []);
      }

      // ★ 关键：只往“侧边栏里的”#navigation 塞节点，防止同名 id 抢占
      function renderMenus(menus) {
        const root = document.querySelector('aside.app-sidebar #navigation'); // ★
        if (!root) return;
        root.innerHTML = '';

        const createItem = (node) => {
          const hasChildren = Array.isArray(node.children) && node.children.length > 0;
          const li = document.createElement('li');
          li.className = 'nav-item';

          if (!hasChildren) {
            const path = node.path || '#';
            li.innerHTML = `
              <a href="${path}" class="nav-link${location.pathname.endsWith('/' + path) ? ' active' : ''}">
                <i class="nav-icon ${node.icon || 'bi bi-speedometer'}"></i>
                <p>${node.name}</p>
              </a>`;
            return li;
          }

          li.innerHTML = `
            <a href="#" class="nav-link">
              <i class="nav-icon ${node.icon || 'bi bi-folder'}"></i>
              <p>${node.name} <i class="nav-arrow bi bi-chevron-right"></i></p>
            </a>`;
          const ul = document.createElement('ul');
          ul.className = 'nav nav-treeview';
          node.children.forEach(ch => ul.appendChild(createItem(ch)));
          li.appendChild(ul);
          return li;
        };

        menus.forEach(m => root.appendChild(createItem(m)));
      }
      // ★ END

      function jumpDefault(menus) {
        const flat = JSON.stringify(menus);
        if ((flat.includes('"/index.html"') || flat.includes('"/dashboard"')) && location.pathname === '/') {
          location.replace('/index.html');
        }
      }

      fetchMenus()
        .then(m => { renderMenus(m || []); jumpDefault(m || []); })
        .catch(e => { console.warn(e); });
    })();
  </script>
  <script>
    (function () {
      // —— 取 token（跟你菜单那套一致）
      const LOGIN_PAGE = 'login.html';
      const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
      const AUTH_HEADERS = token ? { 'Authorization': 'Bearer ' + token } : {};

      // —— DOM
      const $name = document.getElementById('user-name');
      const $title = document.getElementById('user-title');
      const $since = document.getElementById('user-since');
      const $av1 = document.getElementById('user-avatar');
      const $av2 = document.getElementById('user-avatar-large');
      const $out = document.getElementById('btn-signout');

      function setProfile(p = {}) {
        const n = p.nickname || p.fullName || p.realName || p.username || '管理员';
        const role = Number(p.isSuperAdmin) === 1 ? 'Super Admin' : 'Admin';
        const sinceTxt = p.memberSince
          ? `登录时间 ${new Date(p.memberSince).toLocaleDateString()}`
          : '今日登录';

        if ($name) $name.textContent = n;
        if ($title) {
          $title.innerHTML = `${n} - ${role} <small id="user-since">${sinceTxt}</small>`;
        }
        if ($since) $since.textContent = sinceTxt;

        // 头像：优先接口返回，否则用默认头像
        const avatar = p.avatarUrl || p.avatar || 'assets/img/default-avatar.jpg';
        if ($av1) $av1.src = avatar;
        if ($av2) $av2.src = avatar;
      }

      async function loadProfile() {
        const storedUser = JSON.parse(localStorage.getItem('adminUser') || sessionStorage.getItem('adminUser') || 'null');
        setProfile(storedUser || {});
      }

      // —— 退出登录
      $out?.addEventListener('click', () => {
        window.GoalHubAuth?.toLogin ? window.GoalHubAuth.toLogin() : location.href = LOGIN_PAGE;
      });

      loadProfile();
    })();
  </script>
</body>

</html>
