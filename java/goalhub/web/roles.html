    <script>
        const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
        const Default = { scrollbarTheme: 'os-theme-light', scrollbarAutoHide: 'leave', scrollbarClickScroll: true };
        document.addEventListener('DOMContentLoaded', function () {
            const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
            if (sidebarWrapper && OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined) {
                OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                    scrollbars: { theme: Default.scrollbarTheme, autoHide: Default.scrollbarAutoHide, clickScroll: Default.scrollbarClickScroll },
                });
            }
        });
    </script>
    <script>
        (function () {
            const auth = window.GoalHubAuth;

            async function fetchMenus() {
                const res = await auth.authFetch('/admin/auth/menus');
                if (!res.ok) throw new Error('菜单加载失败');
                const data = await res.json();
                return Array.isArray(data) ? data : (data.data || []);
            }

            function renderMenus(menus) {
                const root = document.querySelector('aside.app-sidebar #navigation');
                if (!root) return;
                root.innerHTML = '';

                const createItem = (node) => {
                    const hasChildren = Array.isArray(node.children) && node.children.length > 0;
                    const li = document.createElement('li');
                    li.className = 'nav-item';

                    if (!hasChildren) {
                        const path = node.path || '#';
                        li.innerHTML = `
              <a href="${path}" class="nav-link${location.pathname.endsWith('/' + path) ? ' active' : ''}">
                <i class="nav-icon ${node.icon || 'bi bi-speedometer'}"></i>
                <p>${node.name}</p>
              </a>`;
                        return li;
                    }

                    li.innerHTML = `
            <a href="#" class="nav-link">
              <i class="nav-icon ${node.icon || 'bi bi-folder'}"></i>
              <p>${node.name} <i class="nav-arrow bi bi-chevron-right"></i></p>
            </a>`;
                    const ul = document.createElement('ul');
                    ul.className = 'nav nav-treeview';
                    node.children.forEach(ch => ul.appendChild(createItem(ch)));
                    li.appendChild(ul);
                    return li;
                };

                menus.forEach(m => root.appendChild(createItem(m)));
            }

            fetchMenus()
                .then(m => { renderMenus(m || []); })
                .catch(e => { console.warn(e); });
        })();
    </script>
    <script>
        (function () {
            const auth = window.GoalHubAuth;

            const $name = document.getElementById('user-name');
            const $title = document.getElementById('user-title');
            const $since = document.getElementById('user-since');
            const $av1 = document.getElementById('user-avatar');
            const $av2 = document.getElementById('user-avatar-large');
            const $out = document.getElementById('btn-signout');

            function setProfile(p = {}) {
                const n = p.nickname || p.fullName || p.realName || p.username || '管理员';
                const role = Number(p.isSuperAdmin) === 1 ? 'Super Admin' : 'Admin';
                const sinceTxt = p.memberSince ? `登录时间 ${new Date(p.memberSince).toLocaleDateString()}` : '今日登录';
                if ($name) $name.textContent = n;
                if ($title) $title.innerHTML = `${n} - ${role} <small id="user-since">${sinceTxt}</small>`;
                if ($since) $since.textContent = sinceTxt;
                const avatar = p.avatarUrl || p.avatar || 'assets/img/default-avatar.jpg';
                if ($av1) $av1.src = avatar;
                if ($av2) $av2.src = avatar;
            }

            async function loadProfile() {
                setProfile(auth.getAdminUser() || {});
            }

            $out?.addEventListener('click', () => {
                auth.toLogin();
            });

            loadProfile();
        })();
    </script>
    <script>
        (function () {
            const auth = window.GoalHubAuth;
            const API = {
                users: '/admin/users',
                menus: '/admin/menus',
                userMenus: (id) => `/admin/users/${id}/menus`,
            };

            const state = {
                users: [],
                pageIndex: 1,
                pageSize: 10,
                total: 0,
                username: '',
                currentUser: null,
                menuTree: [],
                checkedSet: new Set(),
                dirty: false,
                onlyChecked: false,
            };

            const $ = (s) => document.querySelector(s);
            const userTbody = $('#user-tbody');
            const userTotal = $('#user-total');
            const pageIndicator = $('#page-indicator');
            const inputKeyword = $('#input-keyword');
            const btnSearch = $('#btn-search');
            const btnPrev = $('#btn-prev');
            const btnNext = $('#btn-next');
            const btnSave = $('#btn-save');
            const btnRefresh = $('#btn-refresh');
            const currentUserTag = $('#current-user-tag');
            const switchOnlyChecked = $('#switch-only-checked');
            const btnCheckAll = $('#btn-check-all');
            const btnUncheckAll = $('#btn-uncheck-all');
            const menuTreeRoot = $('#menu-tree');
            const dirtyTip = $('#dirty-tip');

            async function request(url, options = {}) {
                const res = await auth.authFetch(url, options);
                const data = await res.json().catch(() => ({}));
                if (!(data.code === 200 || data.code === 0 || data.success === true)) {
                    throw new Error(data.message || data.msg || '请求失败');
                }
                return data.data;
            }

            function escapeHtml(s) {
                return (s ?? '').toString().replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            }

            function normalizeMenu(nodes = []) {
                if (!Array.isArray(nodes)) return [];
                return nodes.map(n => ({
                    ...n,
                    id: Number(n.id),
                    children: normalizeMenu(n.children || []),
                })).filter(n => Number.isFinite(n.id));
            }

            function extractMenuIds(payload) {
                if (!Array.isArray(payload)) return flattenMenuIds(normalizeMenu(payload));
                if (payload.every(x => typeof x === 'number' || typeof x === 'string')) {
                    return payload.map(Number).filter(Number.isFinite);
                }
                return flattenMenuIds(normalizeMenu(payload));
            }

            function flattenMenuIds(nodes, bucket = []) {
                nodes.forEach(n => {
                    bucket.push(n.id);
                    if (n.children?.length) flattenMenuIds(n.children, bucket);
                });
                return bucket;
            }

            function collectCheckedMenuIds(nodes, ancestors = [], bucket = new Set()) {
                nodes.forEach(n => {
                    const childBucketSize = bucket.size;
                    collectCheckedMenuIds(n.children || [], [...ancestors, n.id], bucket);
                    const selfChecked = state.checkedSet.has(n.id);
                    const childChecked = bucket.size > childBucketSize;
                    if (selfChecked || childChecked) {
                        ancestors.forEach(id => bucket.add(id));
                        bucket.add(n.id);
                    }
                });
                return bucket;
            }

            function filterTreeByChecked(nodes) {
                return nodes.reduce((arr, n) => {
                    const children = filterTreeByChecked(n.children || []);
                    if (state.checkedSet.has(n.id) || children.length) arr.push({ ...n, children });
                    return arr;
                }, []);
            }

            function setDirty(value) {
                state.dirty = value;
                dirtyTip.classList.toggle('d-none', !value);
                btnSave.disabled = !state.currentUser;
            }

            async function fetchUsers() {
                const params = new URLSearchParams({
                    pageIndex: state.pageIndex,
                    pageSize: state.pageSize,
                });
                if (state.username) params.set('username', state.username);

                const page = await request(`${API.users}?${params.toString()}`);
                const records = page?.records || page?.list || [];
                state.users = records;
                state.total = Math.max(Number(page?.total || 0), records.length);
                state.pageIndex = Number(page?.pageIndex || state.pageIndex);
                state.pageSize = Number(page?.pageSize || state.pageSize);
                renderUsers();
            }

            async function fetchMenus() {
                state.menuTree = normalizeMenu(await request(API.menus));
                renderMenuTree();
            }

            async function fetchUserMenus(userId) {
                const payload = await request(API.userMenus(userId));
                state.checkedSet = new Set(extractMenuIds(payload));
                setDirty(false);
                renderMenuTree();
            }

            async function saveUserMenus() {
                if (!state.currentUser) {
                    alert('请先选择管理员');
                    return;
                }
                const menuIds = [...collectCheckedMenuIds(state.menuTree)].map(Number);
                await request(API.userMenus(state.currentUser.id), {
                    method: 'PUT',
                    body: JSON.stringify({ menuIds }),
                });
                setDirty(false);
                await fetchUserMenus(state.currentUser.id);
                alert('保存成功');
            }

            function renderUsers() {
                if (!state.users.length) {
                    userTbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">暂无管理员</td></tr>';
                } else {
                    userTbody.innerHTML = state.users.map(u => `
                        <tr data-id="${escapeHtml(u.id)}" class="${state.currentUser?.id === u.id ? 'table-primary' : ''}">
                            <td>${escapeHtml(u.id)}</td>
                            <td>
                                <div class="fw-semibold">${escapeHtml(u.username)}</div>
                                <div class="small text-muted">${escapeHtml(u.nickname || '')}</div>
                            </td>
                            <td><button class="btn btn-link btn-sm p-0" data-op="select">分配</button></td>
                        </tr>`).join('');
                }

                userTotal.textContent = state.total;
                const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
                const cur = Math.min(state.pageIndex, pages);
                pageIndicator.textContent = `${cur}/${pages}`;
                btnPrev.disabled = cur <= 1;
                btnNext.disabled = cur >= pages;
            }

            function renderMenuTree() {
                menuTreeRoot.innerHTML = '';
                const data = state.onlyChecked ? filterTreeByChecked(state.menuTree) : state.menuTree;
                if (!data.length) {
                    menuTreeRoot.innerHTML = '<div class="text-muted py-3">暂无菜单</div>';
                    return;
                }
                menuTreeRoot.appendChild(buildTree(data));
                updateAllIndeterminate();
            }

            function buildTree(nodes) {
                const ul = document.createElement('ul');
                ul.className = 'list-unstyled ms-2 mb-0';
                nodes.forEach(node => {
                    const li = document.createElement('li');
                    li.className = 'mb-1';
                    li.dataset.id = node.id;

                    const label = document.createElement('label');
                    label.className = 'd-flex align-items-center gap-2 py-1 mb-0';
                    label.style.cursor = 'pointer';

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.dataset.id = node.id;
                    cb.checked = state.checkedSet.has(node.id);
                    cb.addEventListener('change', onMenuChange);

                    const icon = document.createElement('i');
                    icon.className = node.icon || (node.children?.length ? 'bi bi-folder' : 'bi bi-file-earmark');

                    const text = document.createElement('span');
                    text.textContent = `${node.name}${node.path ? ` (${node.path})` : ''}`;

                    const badge = document.createElement('span');
                    badge.className = 'badge text-bg-light ms-auto';
                    badge.textContent = node.type === 1 ? '目录' : node.type === 2 ? '页面' : '按钮';

                    label.append(cb, icon, text, badge);
                    li.appendChild(label);
                    if (node.children?.length) li.appendChild(buildTree(node.children));
                    ul.appendChild(li);
                });
                return ul;
            }

            function onMenuChange(e) {
                const cb = e.target;
                const id = Number(cb.dataset.id);
                const checked = cb.checked;
                setChecked(id, checked);

                const li = cb.closest('li');
                li.querySelectorAll('ul input[type="checkbox"]').forEach(child => {
                    child.checked = checked;
                    child.indeterminate = false;
                    setChecked(Number(child.dataset.id), checked);
                });

                updateAncestors(cb);
                setDirty(true);
            }

            function setChecked(id, checked) {
                if (checked) state.checkedSet.add(id);
                else state.checkedSet.delete(id);
            }

            function updateAncestors(cb) {
                let li = cb.closest('li');
                while (li?.parentElement?.closest('li')) {
                    const parentLi = li.parentElement.closest('li');
                    const parentCb = parentLi.querySelector(':scope > label input[type="checkbox"]');
                    const childCbs = [...parentLi.querySelectorAll(':scope > ul input[type="checkbox"]')];
                    const checkedCount = childCbs.filter(x => x.checked).length;
                    const indeterminateCount = childCbs.filter(x => x.indeterminate).length;

                    if (checkedCount === 0 && indeterminateCount === 0) {
                        parentCb.checked = false;
                        parentCb.indeterminate = false;
                        setChecked(Number(parentCb.dataset.id), false);
                    } else if (checkedCount === childCbs.length) {
                        parentCb.checked = true;
                        parentCb.indeterminate = false;
                        setChecked(Number(parentCb.dataset.id), true);
                    } else {
                        parentCb.checked = false;
                        parentCb.indeterminate = true;
                        setChecked(Number(parentCb.dataset.id), false);
                    }
                    li = parentLi;
                }
            }

            function updateAllIndeterminate() {
                [...menuTreeRoot.querySelectorAll('li')].reverse().forEach(li => {
                    const parentCb = li.querySelector(':scope > label input[type="checkbox"]');
                    const childCbs = [...li.querySelectorAll(':scope > ul input[type="checkbox"]')];
                    if (!parentCb || !childCbs.length) return;
                    const checkedCount = childCbs.filter(x => x.checked).length;
                    const indeterminateCount = childCbs.filter(x => x.indeterminate).length;
                    if (checkedCount === 0 && indeterminateCount === 0) {
                        parentCb.checked = state.checkedSet.has(Number(parentCb.dataset.id));
                        parentCb.indeterminate = false;
                    } else if (checkedCount === childCbs.length) {
                        parentCb.checked = true;
                        parentCb.indeterminate = false;
                    } else {
                        parentCb.checked = false;
                        parentCb.indeterminate = true;
                    }
                });
            }

            async function selectUser(user) {
                if (state.dirty && !confirm('有未保存更改，确定切换管理员吗？')) return;
                state.currentUser = user;
                currentUserTag.className = 'badge text-bg-success';
                currentUserTag.textContent = `当前管理员：${user.username}（ID:${user.id}）`;
                btnSave.disabled = false;
                renderUsers();
                await fetchUserMenus(user.id);
            }

            userTbody.addEventListener('click', (e) => {
                const tr = e.target.closest('tr[data-id]');
                if (!tr) return;
                const user = state.users.find(u => String(u.id) === String(tr.dataset.id));
                if (user) selectUser(user);
            });

            btnSearch.addEventListener('click', async () => {
                state.username = inputKeyword.value.trim();
                state.pageIndex = 1;
                await fetchUsers();
            });
            inputKeyword.addEventListener('keydown', e => {
                if (e.key === 'Enter') btnSearch.click();
            });
            btnPrev.addEventListener('click', async () => {
                if (state.pageIndex > 1) {
                    state.pageIndex--;
                    await fetchUsers();
                }
            });
            btnNext.addEventListener('click', async () => {
                const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
                if (state.pageIndex < pages) {
                    state.pageIndex++;
                    await fetchUsers();
                }
            });
            btnSave.addEventListener('click', () => saveUserMenus().catch(e => alert(e.message || '保存失败')));
            btnRefresh.addEventListener('click', async () => {
                await Promise.all([fetchUsers(), fetchMenus()]);
                if (state.currentUser) await fetchUserMenus(state.currentUser.id);
            });
            switchOnlyChecked.addEventListener('change', () => {
                state.onlyChecked = switchOnlyChecked.checked;
                renderMenuTree();
            });
            btnCheckAll.addEventListener('click', () => {
                state.checkedSet = new Set(flattenMenuIds(state.menuTree));
                renderMenuTree();
                setDirty(true);
            });
            btnUncheckAll.addEventListener('click', () => {
                state.checkedSet.clear();
                renderMenuTree();
                setDirty(true);
            });

            (async function init() {
                try {
                    await Promise.all([fetchUsers(), fetchMenus()]);
                    const params = new URLSearchParams(location.search);
                    const userId = params.get('userId');
                    if (userId) {
                        const found = state.users.find(u => String(u.id) === String(userId));
                        if (found) await selectUser(found);
                    }
                } catch (e) {
                    console.error(e);
                    alert(e.message || '初始化失败，请检查接口是否可用');
                }
            })();
        })();
    </script></body>

</html>
