<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>GoalHub | 赛事玩法管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <link rel="preload" href="css/adminlte.css" as="style" />
    <link rel="stylesheet" href="./css/vendor.css?v=20260617-2" />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .app-sidebar .sidebar-menu .nav-link { display: flex; align-items: center; }
        .app-sidebar .sidebar-menu .nav-link p { margin: 0 0 0 .5rem; white-space: nowrap; }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a></li></ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" data-lte-toggle="fullscreen"><i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i><i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i></a></li>
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"><img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow" alt="用户头像" /><span id="user-name" class="d-none d-md-inline">管理员</span></a>
                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                            <li class="user-header text-bg-primary"><img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow" alt="用户头像" /><p id="user-title">管理员 - Admin<small id="user-since">今日登录</small></p></li>
                            <li class="user-footer d-flex gap-2"><a id="btn-profile" href="profile.html" class="btn btn-default btn-flat flex-fill">个人资料</a><button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>

        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand"><a href="index.html" class="brand-link"><img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" /><span class="brand-text fw-light">GoalHub</span></a></div>
            <div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column sidebar-menu" data-lte-toggle="treeview" role="menu" aria-label="主导航" data-accordion="false" id="navigation"></ul></nav></div>
        </aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex align-items-center justify-content-between">
                                    <h3 class="card-title mb-0"><i class="bi bi-sliders2-vertical me-2"></i>赛事玩法管理</h3>
                                    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button><button class="btn btn-primary btn-sm" id="btn-create"><i class="bi bi-plus-lg me-1"></i>新增赛事玩法</button></div>
                                </div>
                                <div class="card-body">
                                    <form id="filter-form" class="row g-2">
                                        <div class="col-12 col-md-3"><label class="form-label">关键词</label><input type="text" class="form-control" id="f-keyword" placeholder="赛事 / 玩法 / 子玩法"></div>
                                        <div class="col-12 col-md-2"><label class="form-label">赛事</label><select class="form-select" id="f-matchId" data-option-key="matches" data-empty-label="全部赛事"><option value="">全部赛事</option></select></div>
                                        <div class="col-12 col-md-2"><label class="form-label">玩法</label><select class="form-select" id="f-marketId" data-option-key="markets" data-empty-label="全部玩法"><option value="">全部玩法</option></select></div>
                                        <div class="col-12 col-md-2"><label class="form-label">子玩法</label><select class="form-select" id="f-marketOptionId" data-option-key="filterMarketOptions" data-empty-label="全部子玩法"><option value="">全部子玩法</option></select></div>
                                        <div class="col-6 col-md-1"><label class="form-label">语言</label><input type="text" class="form-control" id="f-langCode" placeholder="zh-CN"></div>
                                        <div class="col-6 col-md-1"><label class="form-label">每页</label><select class="form-select" id="f-pageSize"><option>10</option><option>20</option><option>50</option></select></div>
                                        <div class="col-6 col-md-2"><label class="form-label">可见</label><select class="form-select" id="f-visible"><option value="">全部</option><option value="1">可见</option><option value="0">隐藏</option></select></div>
                                        <div class="col-6 col-md-2"><label class="form-label">投注状态</label><select class="form-select" id="f-betStatus"><option value="">全部</option><option value="OPEN">OPEN</option><option value="CLOSED">CLOSED</option><option value="SUSPENDED">SUSPENDED</option></select></div>
                                        <div class="col-6 col-md-2 d-flex align-items-end"><button type="submit" class="btn btn-dark w-100"><i class="bi bi-search me-1"></i>查询</button></div>
                                        <div class="col-6 col-md-2 d-flex align-items-end"><button type="button" class="btn btn-outline-secondary w-100" id="btn-reset"><i class="bi bi-x-circle me-1"></i>重置</button></div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="card">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover table-striped mb-0 align-middle">
                                            <thead class="table-light">
                                                <tr>
                                                    <th style="width: 80px;">ID</th>
                                                    <th>赛事</th>
                                                    <th>玩法</th>
                                                    <th>子玩法</th>
                                                    <th style="width: 110px;">赔率</th>
                                                    <th style="width: 100px;">可见</th>
                                                    <th style="width: 120px;">投注状态</th>
                                                    <th style="width: 100px;">排序</th>
                                                    <th style="width: 180px;" class="text-end pe-3">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="entity-tbody"><tr><td colspan="9" class="text-center py-4">加载中...</td></tr></tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer"><div class="d-flex justify-content-between align-items-center"><div><span id="entity-total">0</span> 条记录</div><nav><ul class="pagination pagination-sm mb-0" id="entity-pager"></ul></nav></div></div>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="entity-modal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dialog-scrollable">
                            <div class="modal-content">
                                <form id="entity-form">
                                    <div class="modal-header"><h5 class="modal-title" id="entity-modal-title">新增赛事玩法</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
                                    <div class="modal-body">
                                        <input type="hidden" id="entity-id">
                                        <div class="row g-3">
                                            <div class="col-12"><label class="form-label">赛事<span class="text-danger">*</span></label><select class="form-select" id="e-matchId" data-option-key="matches" required><option value="">请选择</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">玩法<span class="text-danger">*</span></label><select class="form-select" id="e-marketId" data-option-key="markets" required><option value="">请选择</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">子玩法<span class="text-danger">*</span></label><select class="form-select" id="e-marketOptionId" data-option-key="formMarketOptions" required><option value="">请选择</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">赔率<span class="text-danger">*</span></label><input type="number" step="0.01" min="0" class="form-control" id="e-odds" required></div>
                                            <div class="col-12 col-md-6"><label class="form-label">排序</label><input type="number" class="form-control" id="e-sortOrder" value="0"></div>
                                            <div class="col-12 col-md-6"><label class="form-label">可见</label><select class="form-select" id="e-visible"><option value="1">可见</option><option value="0">隐藏</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">投注状态</label><select class="form-select" id="e-betStatus"><option value="OPEN">OPEN</option><option value="CLOSED">CLOSED</option><option value="SUSPENDED">SUSPENDED</option></select></div>
                                        </div>
                                    </div>
                                    <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle me-1"></i>保存</button></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer"><div class="float-end d-none d-sm-inline">GoalHub 管理后台</div><strong>Copyright &copy; 2026&nbsp;<span class="text-decoration-none">GoalHub</span>.</strong> All rights reserved.</footer>
    </div>
    <script src="./js/vendor.js?v=20260617-2"></script>
    <script src="./js/adminlte.js"></script>
    <script src="./js/page-common.js"></script>
    <script>
        window.GoalHubEntityConfig = {
            entityName: '赛事玩法',
            createTitle: '新增赛事玩法',
            editTitle: '编辑赛事玩法赔率',
            api: {
                page: '/admin/matchmarketoption/page',
                add: '/admin/matchmarketoption/add',
                update: '/admin/matchmarketoption/update',
                delete: '/admin/matchmarketoption/delete',
            },
            optionLoaders: {
                matches: {
                    api: '/admin/match/match/page',
                    pageSize: 500,
                    label: (x) => {
                        const code = x.matchCode || x.code || x.id;
                        const teams = x.homeTeamName && x.awayTeamName ? ` ${x.homeTeamName} vs ${x.awayTeamName}` : '';
                        return `${code}${teams}`;
                    },
                },
                markets: {
                    api: '/admin/betmarket/page',
                    pageSize: 500,
                    label: (x) => `${x.code || x.name || x.id}${x.name ? ' - ' + x.name : ''}`,
                },
                filterMarketOptions: {
                    api: '/admin/betmarket/option/list',
                    page: false,
                    dependsOn: 'f-marketId',
                    dependsParam: 'marketId',
                    dependsValueType: 'number',
                    label: (x) => `${x.marketName ? x.marketName + ' / ' : ''}${x.code || x.name || x.id}${x.name ? ' - ' + x.name : ''}`,
                },
                formMarketOptions: {
                    api: '/admin/betmarket/option/list',
                    page: false,
                    dependsOn: 'e-marketId',
                    dependsParam: 'marketId',
                    dependsValueType: 'number',
                    label: (x) => `${x.marketName ? x.marketName + ' / ' : ''}${x.code || x.name || x.id}${x.name ? ' - ' + x.name : ''}`,
                },
            },
            filterFields: [
                { id: 'f-matchId', key: 'matchId', valueType: 'number' },
                { id: 'f-marketId', key: 'marketId', valueType: 'number' },
                { id: 'f-marketOptionId', key: 'marketOptionId', valueType: 'number' },
                { id: 'f-visible', key: 'visible', valueType: 'number' },
                { id: 'f-betStatus', key: 'betStatus' },
            ],
            columns: [
                { key: 'matchId', label: '赛事', type: 'select', optionKey: 'matches', displayKey: 'matchName' },
                { key: 'marketId', label: '玩法', type: 'select', optionKey: 'markets', displayKey: 'marketName' },
                { key: 'marketOptionId', label: '子玩法', type: 'select', optionKey: 'formMarketOptions', displayKey: 'marketOptionName' },
                { key: 'odds', label: '赔率' },
                { key: 'visible', label: '可见', type: 'visible' },
                { key: 'betStatus', label: '投注状态', type: 'status' },
                { key: 'sortOrder', label: '排序' },
            ],
            fields: [
                { id: 'e-matchId', key: 'matchId', type: 'select', valueType: 'number', optionKey: 'matches' },
                { id: 'e-marketId', key: 'marketId', type: 'select', valueType: 'number', optionKey: 'markets' },
                { id: 'e-marketOptionId', key: 'marketOptionId', type: 'select', valueType: 'number', optionKey: 'formMarketOptions' },
                { id: 'e-odds', key: 'odds', type: 'number' },
                { id: 'e-visible', key: 'visible', type: 'select', valueType: 'number' },
                { id: 'e-betStatus', key: 'betStatus', type: 'select' },
                { id: 'e-sortOrder', key: 'sortOrder', type: 'number' },
            ],
            createKeys: ['matchId', 'marketId', 'marketOptionId', 'odds', 'visible', 'betStatus', 'sortOrder'],
            updateKeys: ['odds', 'visible', 'betStatus', 'sortOrder'],
            defaults: [['e-visible', '1'], ['e-betStatus', 'OPEN'], ['e-sortOrder', '0']],
        };
    </script>
    <script src="./js/match-management.js"></script>
</body>

</html>
