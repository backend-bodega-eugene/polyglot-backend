<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>GoalHub | 联盟球队玩法赔率管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <link rel="preload" href="css/adminlte.css" as="style" />
    <link rel="stylesheet" href="./css/vendor.css?v=20260617-2" />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .app-sidebar .sidebar-menu .nav-link { display: flex; align-items: center; }
        .app-sidebar .sidebar-menu .nav-link p { margin: 0 0 0 .5rem; white-space: nowrap; }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a></li></ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" data-lte-toggle="fullscreen"><i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i><i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i></a></li>
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"><img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow" alt="用户头像" /><span id="user-name" class="d-none d-md-inline">管理员</span></a>
                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                            <li class="user-header text-bg-primary"><img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow" alt="用户头像" /><p id="user-title">管理员 - Admin<small id="user-since">今日登录</small></p></li>
                            <li class="user-footer d-flex gap-2"><a id="btn-profile" href="profile.html" class="btn btn-default btn-flat flex-fill">个人资料</a><button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>

        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand"><a href="index.html" class="brand-link"><img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" /><span class="brand-text fw-light">GoalHub</span></a></div>
            <div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column sidebar-menu" data-lte-toggle="treeview" role="menu" aria-label="主导航" data-accordion="false" id="navigation"></ul></nav></div>
        </aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex align-items-center justify-content-between">
                                    <h3 class="card-title mb-0"><i class="bi bi-shield-check me-2"></i>联盟球队玩法赔率管理</h3>
                                    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button><button class="btn btn-primary btn-sm" id="btn-create"><i class="bi bi-plus-lg me-1"></i>新增玩法赔率</button></div>
                                </div>
                                <div class="card-body">
                                    <form id="filter-form" class="row g-2">
                                        <div class="col-12 col-md-3"><label class="form-label">关键词</label><input type="text" class="form-control" id="f-keyword" placeholder="球队 / 联赛"></div>
                                        <div class="col-12 col-md-2"><label class="form-label">联赛</label><select class="form-select" id="f-leagueId" data-option-key="leagues" data-empty-label="全部联赛"><option value="">全部联赛</option></select></div>
                                        <div class="col-12 col-md-2"><label class="form-label">球队</label><select class="form-select" id="f-teamId" data-option-key="filterTeams" data-empty-label="全部球队"><option value="">全部球队</option></select></div>
                                        <div class="col-12 col-md-2"><label class="form-label">玩法</label><select class="form-select" id="f-playId" data-option-key="plays" data-empty-label="全部玩法"><option value="">全部玩法</option></select></div>
                                        <div class="col-6 col-md-2"><label class="form-label">玩法编码</label><input type="text" class="form-control" id="f-playCode" placeholder="CHAMPION"></div>
                                        <div class="col-6 col-md-1"><label class="form-label">语言</label><input type="text" class="form-control" id="f-langCode" value="zh-CN" placeholder="zh-CN"></div>
                                        <div class="col-6 col-md-1"><label class="form-label">每页</label><select class="form-select" id="f-pageSize"><option>10</option><option>20</option><option>50</option></select></div>
                                        <div class="col-6 col-md-2"><label class="form-label">可见</label><select class="form-select" id="f-visible"><option value="">全部</option><option value="1">可见</option><option value="0">隐藏</option></select></div>
                                        <div class="col-6 col-md-2"><label class="form-label">投注状态</label><select class="form-select" id="f-betStatus"><option value="">全部</option><option value="OPEN">OPEN</option><option value="CLOSED">CLOSED</option><option value="SUSPENDED">SUSPENDED</option></select></div>
                                        <div class="col-6 col-md-2 d-flex align-items-end"><button type="submit" class="btn btn-dark w-100"><i class="bi bi-search me-1"></i>查询</button></div>
                                        <div class="col-6 col-md-2 d-flex align-items-end"><button type="button" class="btn btn-outline-secondary w-100" id="btn-reset"><i class="bi bi-x-circle me-1"></i>重置</button></div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="card">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover table-striped mb-0 align-middle">
                                            <thead class="table-light">
                                                <tr>
                                                    <th style="width: 80px;">ID</th>
                                                    <th>联赛</th>
                                                    <th>玩法编码</th>
                                                    <th>玩法名称</th>
                                                    <th>球队</th>
                                                    <th>球队快照</th>
                                                    <th style="width: 110px;">赔率</th>
                                                    <th style="width: 100px;">可见</th>
                                                    <th style="width: 120px;">投注状态</th>
                                                    <th style="width: 100px;">排序</th>
                                                    <th style="width: 170px;">创建时间</th>
                                                    <th style="width: 170px;">更新时间</th>
                                                    <th style="width: 180px;" class="text-end pe-3">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="entity-tbody"><tr><td colspan="13" class="text-center py-4">加载中...</td></tr></tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer"><div class="d-flex justify-content-between align-items-center"><div><span id="entity-total">0</span> 条记录</div><nav><ul class="pagination pagination-sm mb-0" id="entity-pager"></ul></nav></div></div>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="entity-modal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dialog-scrollable">
                            <div class="modal-content">
                                <form id="entity-form">
                                    <div class="modal-header"><h5 class="modal-title" id="entity-modal-title">新增玩法赔率</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
                                    <div class="modal-body">
                                        <input type="hidden" id="entity-id">
                                        <div class="row g-3">
                                            <div class="col-12 col-md-6"><label class="form-label">联赛<span class="text-danger">*</span></label><select class="form-select" id="e-leagueId" data-option-key="leagues" required><option value="">请选择</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">球队<span class="text-danger">*</span></label><select class="form-select" id="e-teamId" data-option-key="formTeams" required><option value="">请选择</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">玩法<span class="text-danger">*</span></label><select class="form-select" id="e-playId" data-option-key="plays" required><option value="">请选择</option></select></div>
                                            <div class="col-12 col-md-3"><label class="form-label">玩法编码<span class="text-danger">*</span></label><input type="text" class="form-control" id="e-playCode" placeholder="CHAMPION" required></div>
                                            <div class="col-12 col-md-3"><label class="form-label">玩法名称<span class="text-danger">*</span></label><input type="text" class="form-control" id="e-playName" placeholder="冠军" required></div>
                                            <div class="col-12 col-md-6"><label class="form-label">赔率<span class="text-danger">*</span></label><input type="number" step="0.01" min="0" class="form-control" id="e-odds" required></div>
                                            <div class="col-12 col-md-6"><label class="form-label">排序</label><input type="number" class="form-control" id="e-sortOrder" value="0"></div>
                                            <div class="col-12 col-md-6"><label class="form-label">可见</label><select class="form-select" id="e-visible"><option value="1">可见</option><option value="0">隐藏</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">投注状态</label><select class="form-select" id="e-betStatus"><option value="OPEN">OPEN</option><option value="CLOSED">CLOSED</option><option value="SUSPENDED">SUSPENDED</option></select></div>
                                            <div class="col-12 col-md-6"><label class="form-label">语言</label><input type="text" class="form-control" id="e-langCode" value="zh-CN" placeholder="zh-CN"></div>
                                            <div class="col-12 col-md-6"><label class="form-label">球队快照</label><input type="text" class="form-control" id="e-teamNameSnapshot" placeholder="编辑时可更新"></div>
                                        </div>
                                    </div>
                                    <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle me-1"></i>保存</button></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer"><div class="float-end d-none d-sm-inline">GoalHub 管理后台</div><strong>Copyright &copy; 2026&nbsp;<span class="text-decoration-none">GoalHub</span>.</strong> All rights reserved.</footer>
    </div>
    <script src="./js/vendor.js?v=20260617-2"></script>
    <script src="./js/adminlte.js"></script>
    <script src="./js/page-common.js"></script>
    <script>
        window.GoalHubEntityConfig = {
            entityName: '联盟球队玩法赔率',
            createTitle: '新增联盟球队玩法赔率',
            editTitle: '编辑联盟球队玩法赔率',
            api: {
                page: '/admin/leagueteammarketodds/page',
                add: '/admin/leagueteammarketodds/add',
                update: '/admin/leagueteammarketodds/update',
                delete: '/admin/leagueteammarketodds/delete',
            },
            optionLoaders: {
                leagues: {
                    api: '/admin/match/league/page',
                    pageSize: 500,
                    label: (x) => `${x.code || x.leagueCode || x.id}${x.name ? ' - ' + x.name : ''}`,
                },
                plays: {
                    api: '/admin/betmarket/page',
                    pageSize: 500,
                    label: (x) => `${x.code || x.name || x.id}${x.name ? ' - ' + x.name : ''}`,
                    fillFields: {
                        'e-playCode': 'code',
                        'e-playName': 'name',
                    },
                },
                filterTeams: {
                    api: '/admin/leagueteammarketodds/leagueteams',
                    page: false,
                    dependsOn: 'f-leagueId',
                    dependsParam: 'leagueId',
                    dependsValueType: 'number',
                    valueKey: 'teamId',
                    body: { langCode: 'zh-CN' },
                    label: (x) => `${x.teamCode || x.teamId}${x.teamName ? ' - ' + x.teamName : ''}`,
                },
                formTeams: {
                    api: '/admin/leagueteammarketodds/leagueteams',
                    page: false,
                    dependsOn: 'e-leagueId',
                    dependsParam: 'leagueId',
                    dependsValueType: 'number',
                    valueKey: 'teamId',
                    body: { langCode: 'zh-CN' },
                    label: (x) => `${x.teamCode || x.teamId}${x.teamName ? ' - ' + x.teamName : ''}`,
                },
            },
            filterFields: [
                { id: 'f-leagueId', key: 'leagueId', valueType: 'number' },
                { id: 'f-playId', key: 'playId', valueType: 'number' },
                { id: 'f-playCode', key: 'playCode' },
                { id: 'f-teamId', key: 'teamId', valueType: 'number' },
                { id: 'f-visible', key: 'visible', valueType: 'number' },
                { id: 'f-betStatus', key: 'betStatus' },
            ],
            columns: [
                { key: 'leagueId', label: '联赛', type: 'select', optionKey: 'leagues', displayKey: 'leagueName' },
                { key: 'playCode', label: '玩法编码' },
                { key: 'playName', label: '玩法名称' },
                { key: 'teamId', label: '球队', type: 'select', optionKey: 'formTeams', displayKey: 'teamName' },
                { key: 'teamNameSnapshot', label: '球队快照' },
                { key: 'odds', label: '赔率' },
                { key: 'visible', label: '可见', type: 'visible' },
                { key: 'betStatus', label: '投注状态', type: 'status' },
                { key: 'sortOrder', label: '排序' },
                { key: 'createdAt', label: '创建时间', type: 'datetime' },
                { key: 'updatedAt', label: '更新时间', type: 'datetime' },
            ],
            fields: [
                { id: 'e-leagueId', key: 'leagueId', type: 'select', valueType: 'number', optionKey: 'leagues' },
                { id: 'e-teamId', key: 'teamId', type: 'select', valueType: 'number', optionKey: 'formTeams' },
                { id: 'e-playId', key: 'playId', type: 'select', valueType: 'number', optionKey: 'plays' },
                { id: 'e-playCode', key: 'playCode' },
                { id: 'e-playName', key: 'playName' },
                { id: 'e-odds', key: 'odds', type: 'number' },
                { id: 'e-visible', key: 'visible', type: 'select', valueType: 'number' },
                { id: 'e-betStatus', key: 'betStatus', type: 'select' },
                { id: 'e-sortOrder', key: 'sortOrder', type: 'number' },
                { id: 'e-langCode', key: 'langCode' },
                { id: 'e-teamNameSnapshot', key: 'teamNameSnapshot' },
            ],
            createKeys: ['leagueId', 'playId', 'playCode', 'playName', 'teamId', 'odds', 'visible', 'betStatus', 'sortOrder', 'langCode'],
            updateKeys: ['odds', 'visible', 'betStatus', 'sortOrder', 'teamNameSnapshot'],
            defaults: [['e-visible', '1'], ['e-betStatus', 'OPEN'], ['e-sortOrder', '0'], ['e-langCode', 'zh-CN']],
        };
    </script>
    <script src="./js/match-management.js"></script>
</body>

</html>
