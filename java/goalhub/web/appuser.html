        const Default = { scrollbarTheme: 'os-theme-light', scrollbarAutoHide: 'leave', scrollbarClickScroll: true };
        document.addEventListener('DOMContentLoaded', function () {
            const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
            if (sidebarWrapper && OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined) {
                OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                    scrollbars: { theme: Default.scrollbarTheme, autoHide: Default.scrollbarAutoHide, clickScroll: Default.scrollbarClickScroll },
                });
            }

    <script>
        (function () {
            const auth = window.GoalHubAuth;

            async function fetchMenus() {
                const res = await auth.authFetch('/admin/auth/menus');
                if (!res.ok) throw new Error('菜单加载失败');
                const data = await res.json();
                return Array.isArray(data) ? data : (data.data || []);
            }

            function renderMenus(menus) {
                const root = document.querySelector('aside.app-sidebar #navigation');
                if (!root) return;
                root.innerHTML = '';

                const createItem = (node) => {
                    const hasChildren = Array.isArray(node.children) && node.children.length > 0;
                    const li = document.createElement('li');
                    li.className = 'nav-item';

                    if (!hasChildren) {
                        const path = node.path || '#';
                        li.innerHTML = `
              <a href="${path}" class="nav-link${location.pathname.endsWith('/' + path) ? ' active' : ''}">
                <i class="nav-icon ${node.icon || 'bi bi-speedometer'}"></i>
                <p>${node.name}</p>
              </a>`;
                        return li;
                    }

                    li.innerHTML = `
            <a href="#" class="nav-link">
              <i class="nav-icon ${node.icon || 'bi bi-folder'}"></i>
              <p>${node.name} <i class="nav-arrow bi bi-chevron-right"></i></p>
            </a>`;
                    const ul = document.createElement('ul');
                    ul.className = 'nav nav-treeview';
                    node.children.forEach(ch => ul.appendChild(createItem(ch)));
                    li.appendChild(ul);
                    return li;
                };

                menus.forEach(m => root.appendChild(createItem(m)));
            }

            fetchMenus()
                .then(m => { renderMenus(m || []); })
                .catch(e => { console.warn(e); });
        })();
    </script>

    <script>
        (function () {
            const auth = window.GoalHubAuth;

            const $name = document.getElementById('user-name');
            const $title = document.getElementById('user-title');
            const $since = document.getElementById('user-since');
            const $av1 = document.getElementById('user-avatar');
            const $av2 = document.getElementById('user-avatar-large');
            const $out = document.getElementById('btn-signout');

            function setProfile(p = {}) {
                const n = p.nickname || p.fullName || p.realName || p.username || '管理员';
                const role = Number(p.isSuperAdmin) === 1 ? 'Super Admin' : 'Admin';
                const sinceTxt = p.memberSince
                    ? `登录时间 ${new Date(p.memberSince).toLocaleDateString()}`
                    : '今日登录';

                if ($name) $name.textContent = n;
                if ($title) {
                    $title.innerHTML = `${n} - ${role} <small id="user-since">${sinceTxt}</small>`;
                }
                if ($since) $since.textContent = sinceTxt;

                const avatar = p.avatarUrl || p.avatar || 'assets/img/default-avatar.jpg';
                if ($av1) $av1.src = avatar;
                if ($av2) $av2.src = avatar;
            }

            $out?.addEventListener('click', () => {
                auth.toLogin();
            });

            setProfile(auth.getAdminUser() || {});
        })();
    </script>

    <script>
        (function () {
            const auth = window.GoalHubAuth;
            const API = '/admin/appusers';
            const state = {
                pageIndex: 1,
                pageSize: 10,
                total: 0,
                list: [],
                filters: {},
            };

            const $tbody = document.getElementById('users-tbody');
            const $pager = document.getElementById('users-pager');
            const $total = document.getElementById('users-total');
            const $form = document.getElementById('filter-form');
            const $reset = document.getElementById('btn-reset');
            const $refresh = document.getElementById('btn-refresh');
            const $create = document.getElementById('btn-create');

            const $fUsername = document.getElementById('f-username');
            const $fNickname = document.getElementById('f-nickname');
            const $fEmail = document.getElementById('f-email');
            const $fPhone = document.getElementById('f-phone');
            const $fStatus = document.getElementById('f-status');
            const $fPageSize = document.getElementById('f-pageSize');
            const $fCreatedStart = document.getElementById('f-created-start');
            const $fCreatedEnd = document.getElementById('f-created-end');

            const userModal = new bootstrap.Modal(document.getElementById('user-modal'));
            const $uform = document.getElementById('user-form');
            const $uid = document.getElementById('u-id');
            const $uUsername = document.getElementById('u-username');
            const $uNickname = document.getElementById('u-nickname');
            const $uEmail = document.getElementById('u-email');
            const $uPhone = document.getElementById('u-phone');
            const $uAvatar = document.getElementById('u-avatar');
            const $uStatus = document.getElementById('u-status');
            const $uPassword = document.getElementById('u-password');
            const $uPasswordWrap = document.getElementById('u-password-wrap');
            const $modalTitle = document.getElementById('user-modal-title');

            const passwordModal = new bootstrap.Modal(document.getElementById('password-modal'));
            const $pform = document.getElementById('password-form');
            const $pid = document.getElementById('p-id');
            const $pusername = document.getElementById('p-username');
            const $ppassword = document.getElementById('p-password');

            const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            const ok = (data) => data && (data.code === 200 || data.code === 0 || data.success === true);
            const messageOf = (data, fallback) => data?.message || data?.msg || fallback;

            function fmtTime(value) {
                if (!value) return '-';
                const date = new Date(String(value));
                return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
            }

            function isoFromLocal(value) {
                if (!value) return '';
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? '' : date.toISOString();
            }

            async function request(url, options = {}) {
                const res = await auth.authFetch(url, options);
                const text = await res.text();
                let data = {};
                if (text) {
                    try {
                        data = JSON.parse(text);
                    } catch (_) {
                        if (res.ok) return {};
                        throw new Error('接口返回格式错误');
                    }
                }
                if (!text && res.ok) return data;
                if (!ok(data)) throw new Error(messageOf(data, '请求失败'));
                return data;
            }

            function readFilters() {
                return {
                    username: $fUsername.value.trim(),
                    nickname: $fNickname.value.trim(),
                    email: $fEmail.value.trim(),
                    phone: $fPhone.value.trim(),
                    status: $fStatus.value === '' ? '' : Number($fStatus.value),
                    createdAtStart: isoFromLocal($fCreatedStart.value),
                    createdAtEnd: isoFromLocal($fCreatedEnd.value),
                };
            }

            function buildPageBody() {
                const body = {
                    pageIndex: state.pageIndex,
                    pageSize: state.pageSize,
                };
                Object.entries(state.filters).forEach(([key, value]) => {
                    if (value !== '' && value !== null && value !== undefined) body[key] = value;
                });
                return body;
            }

            async function apiList() {
                const data = await request(`${API}/page`, {
                    method: 'POST',
                    body: JSON.stringify(buildPageBody()),
                });
                const page = data.data || {};
                const records = page.records || page.list || page.rows || page.data || [];
                return {
                    list: Array.isArray(records) ? records : [],
                    total: Math.max(Number(page.total || page.totalCount || 0), Array.isArray(records) ? records.length : 0),
                    pageIndex: Number(page.pageIndex || page.current || state.pageIndex),
                    pageSize: Number(page.pageSize || page.size || state.pageSize),
                };
            }

            function apiCreate(body) {
                return request(API, { method: 'POST', body: JSON.stringify(body) });
            }

            function apiUpdate(id, body) {
                return request(`${API}/${id}`, { method: 'PUT', body: JSON.stringify(body) });
            }

            function apiUpdatePassword(id, password) {
                return request(`${API}/${id}/password`, {
                    method: 'PUT',
                    body: JSON.stringify({ password }),
                });
            }

            function apiDelete(id) {
                return request(`${API}/${id}`, { method: 'DELETE' });
            }

            function renderRows(list) {
                if (!list || list.length === 0) {
                    $tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-muted">暂无数据</td></tr>`;
                    return;
                }

                $tbody.innerHTML = list.map((x) => {
                    const id = x.id ?? x.userId ?? '';
                    const username = x.username ?? '';
                    const nickname = x.nickname ?? '';
                    const status = Number(x.status ?? 1);
                    const avatar = x.avatarUrl || x.avatar || 'assets/img/default-avatar.jpg';
                    return `
        <tr data-id="${esc(id)}">
          <td>${esc(id)}</td>
          <td><img src="${esc(avatar)}" alt="头像" class="rounded-circle app-user-avatar" onerror="this.src='assets/img/default-avatar.jpg'"></td>
          <td>${esc(username)}</td>
          <td>${esc(nickname)}</td>
          <td>${esc(x.email || '')}</td>
          <td>${esc(x.phone || '')}</td>
          <td>${status === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>'}</td>
          <td>${esc(fmtTime(x.createdAt || x.createTime))}</td>
          <td>${esc(fmtTime(x.updatedAt || x.updateTime))}</td>
          <td class="text-end pe-3">
            <button class="btn btn-outline-primary btn-sm me-1" data-op="edit">编辑</button>
            <button class="btn btn-outline-warning btn-sm me-1" data-op="password">密码</button>
            <button class="btn btn-outline-danger btn-sm" data-op="del">删除</button>
          </td>
        </tr>`;
                }).join('');
            }

            function renderPager() {
                const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
                const cur = Math.min(state.pageIndex, pages);
                const item = (p, txt, disabled = false, active = false) =>
                    `<li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}"><a href="#" class="page-link" data-page="${p}">${txt}</a></li>`;
                const items = [item(cur - 1, '&laquo;', cur <= 1)];
                const start = Math.max(1, cur - 3);
                const end = Math.min(pages, start + 6);
                for (let p = start; p <= end; p++) items.push(item(p, p, false, p === cur));
                items.push(item(cur + 1, '&raquo;', cur >= pages));
                $pager.innerHTML = items.join('');
                $total.textContent = state.total;
            }

            async function reload() {
                try {
                    $tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4">加载中...</td></tr>`;
                    const page = await apiList();
                    state.list = page.list;
                    state.total = page.total;
                    state.pageIndex = page.pageIndex;
                    state.pageSize = page.pageSize;
                    renderRows(state.list);
                    renderPager();
                } catch (error) {
                    console.error(error);
                    $tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-danger">${esc(error.message || '加载失败')}</td></tr>`;
                }
            }

            function findRow(id) {
                return state.list.find(x => String(x.id ?? x.userId) === String(id));
            }

            $form.addEventListener('submit', (e) => {
                e.preventDefault();
                state.filters = readFilters();
                state.pageSize = Number($fPageSize.value || 10);
                state.pageIndex = 1;
                reload();
            });

            $reset.addEventListener('click', () => {
                $form.reset();
                $fPageSize.value = String(state.pageSize);
                state.filters = {};
                state.pageIndex = 1;
                reload();
            });

            $refresh.addEventListener('click', reload);

            $pager.addEventListener('click', (e) => {
                const a = e.target.closest('a[data-page]');
                if (!a) return;
                e.preventDefault();
                const page = Number(a.dataset.page);
                if (!Number.isFinite(page) || page < 1 || page === state.pageIndex) return;
                state.pageIndex = page;
                reload();
            });

            $create.addEventListener('click', () => {
                $uform.reset();
                $uid.value = '';
                $uUsername.disabled = false;
                $uPassword.required = true;
                $uPasswordWrap.style.display = '';
                $uStatus.value = '1';
                $modalTitle.textContent = '新增App用户';
                userModal.show();
            });

            $tbody.addEventListener('click', async (e) => {
                const btn = e.target.closest('button[data-op]');
                if (!btn) return;
                const id = btn.closest('tr')?.dataset?.id;
                const row = findRow(id);
                if (!row) return;

                if (btn.dataset.op === 'edit') {
                    $uform.reset();
                    $uid.value = id;
                    $uUsername.value = row.username || '';
                    $uUsername.disabled = true;
                    $uNickname.value = row.nickname || '';
                    $uEmail.value = row.email || '';
                    $uPhone.value = row.phone || '';
                    $uAvatar.value = row.avatarUrl || row.avatar || '';
                    $uStatus.value = String(row.status ?? 1);
                    $uPassword.value = '';
                    $uPassword.required = false;
                    $uPasswordWrap.style.display = '';
                    $modalTitle.textContent = '编辑App用户';
                    userModal.show();
                    return;
                }

                if (btn.dataset.op === 'password') {
                    $pform.reset();
                    $pid.value = id;
                    $pusername.value = row.username || '';
                    passwordModal.show();
                    return;
                }

                if (btn.dataset.op === 'del') {
                    if (!confirm('确定删除该用户？此操作不可恢复。')) return;
                    try {
                        await apiDelete(id);
                        await reload();
                    } catch (error) {
                        alert(error.message || '删除失败');
                    }
                }
            });

            $uform.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = $uid.value.trim();
                const isCreate = !id;
                const body = {
                    email: $uEmail.value.trim(),
                    phone: $uPhone.value.trim(),
                    nickname: $uNickname.value.trim(),
                    avatarUrl: $uAvatar.value.trim(),
                    status: Number($uStatus.value),
                };

                if (isCreate) {
                    body.username = $uUsername.value.trim();
                    body.password = $uPassword.value;
                    if (!body.username || !body.password) {
                        alert('用户名和密码不能为空');
                        return;
                    }
                } else if ($uPassword.value) {
                    body.password = $uPassword.value;
                }

                try {
                    if (isCreate) await apiCreate(body);
                    else await apiUpdate(id, body);
                    userModal.hide();
                    await reload();
                } catch (error) {
                    alert(error.message || '保存失败');
                }
            });

            $pform.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = $pid.value;
                const password = $ppassword.value;
                if (!password) {
                    alert('请输入新密码');
                    return;
                }
                try {
                    await apiUpdatePassword(id, password);
                    passwordModal.hide();
                    alert('密码已修改');
                } catch (error) {
                    alert(error.message || '密码修改失败');
                }
            });

            $fPageSize.value = String(state.pageSize);
            state.filters = readFilters();
            reload();
        })();
    </script>
</body>

</html>
