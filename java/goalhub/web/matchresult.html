    <script>
        (function () {
            const auth = window.GoalHubAuth;
            const API = '/admin/matchresult';
            const state = { pageIndex: 1, pageSize: 10, total: 0, list: [], filters: {} };

            const $tbody = document.getElementById('results-tbody');
            const $pager = document.getElementById('results-pager');
            const $total = document.getElementById('results-total');
            const $form = document.getElementById('filter-form');
            const $reset = document.getElementById('btn-reset');
            const $refresh = document.getElementById('btn-refresh');
            const $fMatchName = document.getElementById('f-match-name');
            const $fTeamName = document.getElementById('f-team-name');
            const $fLangCode = document.getElementById('f-lang-code');
            const $fMatchStatus = document.getElementById('f-match-status');
            const $fPageSize = document.getElementById('f-pageSize');
            const $fStart = document.getElementById('f-start');
            const $fEnd = document.getElementById('f-end');

            const resultModal = new bootstrap.Modal(document.getElementById('result-modal'));
            const $resultForm = document.getElementById('result-form');
            const $rMatchId = document.getElementById('r-match-id');
            const $rMatchLabel = document.getElementById('r-match-label');
            const $rEndedAt = document.getElementById('r-ended-at');
            const fields = {
                regularHomeScore: document.getElementById('r-regular-home'),
                regularAwayScore: document.getElementById('r-regular-away'),
                extraHomeScore: document.getElementById('r-extra-home'),
                extraAwayScore: document.getElementById('r-extra-away'),
                penaltyHomeScore: document.getElementById('r-penalty-home'),
                penaltyAwayScore: document.getElementById('r-penalty-away'),
                homePenaltyCount: document.getElementById('r-home-penalty-count'),
                awayPenaltyCount: document.getElementById('r-away-penalty-count'),
                homeCornerCount: document.getElementById('r-home-corner-count'),
                awayCornerCount: document.getElementById('r-away-corner-count'),
                homeThrowInCount: document.getElementById('r-home-throwin-count'),
                awayThrowInCount: document.getElementById('r-away-throwin-count'),
                homeFoulCount: document.getElementById('r-home-foul-count'),
                awayFoulCount: document.getElementById('r-away-foul-count'),
                homeFreeKickCount: document.getElementById('r-home-freekick-count'),
                awayFreeKickCount: document.getElementById('r-away-freekick-count'),
                homeRedCardCount: document.getElementById('r-home-red-count'),
                awayRedCardCount: document.getElementById('r-away-red-count'),
                homeYellowCardCount: document.getElementById('r-home-yellow-count'),
                awayYellowCardCount: document.getElementById('r-away-yellow-count'),
            };

            const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            const ok = (data) => data && (data.code === 200 || data.code === 0 || data.success === true);
            const messageOf = (data, fallback) => data?.message || data?.msg || fallback;

            function fmtTime(value) {
                if (!value) return '-';
                const date = new Date(String(value));
                return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
            }

            function isoFromLocal(value) {
                if (!value) return '';
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? '' : date.toISOString();
            }

            function localDateTimeSeconds(value) {
                if (!value) return '';
                return value.length === 16 ? `${value}:00` : value;
            }

            function localFromValue(value) {
                if (!value) return '';
                const date = new Date(String(value));
                if (Number.isNaN(date.getTime())) return '';
                const pad = (n) => String(n).padStart(2, '0');
                return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
            }

            function intOrZero(value) {
                if (value === '' || value === null || value === undefined) return 0;
                const num = Number(value);
                return Number.isFinite(num) ? Math.max(0, Math.trunc(num)) : 0;
            }

            async function request(url, options = {}) {
                const res = await auth.authFetch(url, options);
                const text = await res.text();
                let data = {};
                if (text) {
                    try {
                        data = JSON.parse(text);
                    } catch (_) {
                        if (res.ok) return {};
                        throw new Error('接口返回格式错误');
                    }
                }
                if (!text && res.ok) return data;
                if (!res.ok || !ok(data)) throw new Error(messageOf(data, '请求失败'));
                return data;
            }

            function readFilters() {
                return {
                    matchName: $fMatchName.value.trim(),
                    teamName: $fTeamName.value.trim(),
                    langCode: $fLangCode.value.trim(),
                    matchStatus: $fMatchStatus.value.trim(),
                    startTime: isoFromLocal($fStart.value),
                    endTime: isoFromLocal($fEnd.value),
                };
            }

            function buildPageBody() {
                const body = { pageIndex: state.pageIndex - 1, pageSize: state.pageSize };
                Object.entries(state.filters).forEach(([key, value]) => {
                    if (value !== '' && value !== null && value !== undefined) body[key] = value;
                });
                return body;
            }

            function extractPage(data) {
                const page = data.data || data.result || data || {};
                const records = page.records || page.list || page.rows || page.data || [];
                const rawPageIndex = page.pageIndex ?? page.current ?? page.pageNum;
                const nextPageIndex = rawPageIndex === undefined ? state.pageIndex : Number(rawPageIndex) + 1;
                return {
                    list: Array.isArray(records) ? records : [],
                    total: Math.max(Number(page.total || page.totalCount || 0), Array.isArray(records) ? records.length : 0),
                    pageIndex: Number.isFinite(nextPageIndex) ? nextPageIndex : state.pageIndex,
                    pageSize: Number(page.pageSize || page.size || state.pageSize),
                };
            }

            async function apiList() {
                const data = await request(`${API}/page`, {
                    method: 'POST',
                    body: JSON.stringify(buildPageBody()),
                });
                return extractPage(data);
            }

            function apiSave(body) {
                return request(`${API}/judge/save`, { method: 'POST', body: JSON.stringify(body) });
            }

            function apiApprove(matchId) {
                return request(`${API}/approve`, {
                    method: 'POST',
                    body: JSON.stringify({ matchId: Number(matchId) }),
                });
            }

            function scorePair(home, away) {
                const h = home ?? '-';
                const a = away ?? '-';
                return `${h} : ${a}`;
            }

            function resultBadge(status) {
                return Number(status) === 1
                    ? '<span class="badge bg-success">已审核</span>'
                    : '<span class="badge bg-warning text-dark">未审核</span>';
            }

            function renderRows(list) {
                if (!list || list.length === 0) {
                    $tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-muted">暂无数据</td></tr>`;
                    return;
                }

                $tbody.innerHTML = list.map((x) => {
                    const matchId = x.matchId ?? '';
                    const approved = Number(x.resultStatus ?? 0) === 1;
                    return `
        <tr data-id="${esc(matchId)}">
          <td>${esc(matchId)}</td>
          <td class="match-name">
            <div class="fw-semibold">${esc(x.matchName || x.matchCode || '-')}</div>
            <div class="text-muted small">${esc(x.matchCode || '')}</div>
          </td>
          <td>${esc(x.homeTeamName || x.homeTeamId || '-')} <span class="text-muted">vs</span> ${esc(x.awayTeamName || x.awayTeamId || '-')}</td>
          <td class="score-cell">${esc(scorePair(x.regularHomeScore, x.regularAwayScore))}</td>
          <td class="score-cell">${esc(scorePair(x.extraHomeScore, x.extraAwayScore))}</td>
          <td class="score-cell">${esc(scorePair(x.penaltyHomeScore, x.penaltyAwayScore))}</td>
          <td>${resultBadge(x.resultStatus)}</td>
          <td>${esc(fmtTime(x.matchStartTime))}</td>
          <td>${esc(fmtTime(x.matchEndedAt))}</td>
          <td class="text-end pe-3">
            <button class="btn btn-outline-primary btn-sm me-1" data-op="edit">结果</button>
            <button class="btn btn-outline-success btn-sm" data-op="approve" ${approved ? 'disabled' : ''}>审核</button>
          </td>
        </tr>`;
                }).join('');
            }

            function renderPager() {
                const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
                const cur = Math.min(Math.max(1, state.pageIndex), pages);
                const item = (p, txt, disabled = false, active = false) =>
                    `<li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}"><a href="#" class="page-link" data-page="${p}">${txt}</a></li>`;
                const items = [item(cur - 1, '&laquo;', cur <= 1)];
                const start = Math.max(1, cur - 3);
                const end = Math.min(pages, start + 6);
                for (let p = start; p <= end; p++) items.push(item(p, p, false, p === cur));
                items.push(item(cur + 1, '&raquo;', cur >= pages));
                $pager.innerHTML = items.join('');
                $total.textContent = state.total;
            }

            async function reload() {
                try {
                    $tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4">加载中...</td></tr>`;
                    const page = await apiList();
                    state.list = page.list;
                    state.total = page.total;
                    state.pageIndex = page.pageIndex;
                    state.pageSize = page.pageSize;
                    renderRows(state.list);
                    renderPager();
                } catch (error) {
                    console.error(error);
                    $tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-danger">${esc(error.message || '加载失败')}</td></tr>`;
                }
            }

            function findRow(matchId) {
                return state.list.find((x) => String(x.matchId) === String(matchId));
            }

            function openResultModal(row) {
                $resultForm.reset();
                $rMatchId.value = row.matchId ?? '';
                $rMatchLabel.value = `${row.matchName || row.matchCode || '-'} / ${row.homeTeamName || row.homeTeamId || '-'} vs ${row.awayTeamName || row.awayTeamId || '-'}`;
                $rEndedAt.value = localFromValue(row.matchEndedAt);
                Object.entries(fields).forEach(([key, input]) => {
                    input.value = row[key] ?? 0;
                });
                resultModal.show();
            }

            $form.addEventListener('submit', (e) => {
                e.preventDefault();
                state.filters = readFilters();
                state.pageSize = Number($fPageSize.value || 10);
                state.pageIndex = 1;
                reload();
            });

            $reset.addEventListener('click', () => {
                $form.reset();
                $fPageSize.value = String(state.pageSize);
                state.filters = {};
                state.pageIndex = 1;
                reload();
            });

            $refresh.addEventListener('click', reload);

            $pager.addEventListener('click', (e) => {
                const a = e.target.closest('a[data-page]');
                if (!a) return;
                e.preventDefault();
                const page = Number(a.dataset.page);
                if (!Number.isFinite(page) || page < 1 || page === state.pageIndex) return;
                state.pageIndex = page;
                reload();
            });

            $tbody.addEventListener('click', async (e) => {
                const btn = e.target.closest('button[data-op]');
                if (!btn) return;
                const matchId = btn.closest('tr')?.dataset?.id;
                const row = findRow(matchId);
                if (!row) return;

                if (btn.dataset.op === 'edit') {
                    openResultModal(row);
                    return;
                }

                if (btn.dataset.op === 'approve') {
                    if (!confirm('确定审核该赛事结果吗？')) return;
                    try {
                        await apiApprove(matchId);
                        await reload();
                    } catch (error) {
                        alert(error.message || '审核失败');
                    }
                }
            });

            $resultForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const matchId = Number($rMatchId.value);
                if (!Number.isFinite(matchId) || matchId <= 0) {
                    alert('赛事ID无效');
                    return;
                }
                const body = { matchId, matchEndedAt: localDateTimeSeconds($rEndedAt.value) || null };
                Object.entries(fields).forEach(([key, input]) => {
                    body[key] = intOrZero(input.value);
                });
                try {
                    await apiSave(body);
                    resultModal.hide();
                    await reload();
                } catch (error) {
                    alert(error.message || '保存失败');
                }
            });

            $fPageSize.value = String(state.pageSize);
            state.filters = readFilters();
            reload();
        })();
    </script>
</body>

</html>
