<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>GoalHub | 内容编辑</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <link rel="preload" href="css/adminlte.css" as="style" />
    <link rel="stylesheet" href="./css/vendor.css?v=20260617-2" />
    <link rel="stylesheet" href="./assets/vendor/quill/dist/quill.snow.css" />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .app-sidebar .sidebar-menu .nav-link { display: flex; align-items: center; }
        .app-sidebar .sidebar-menu .nav-link p { margin: 0 0 0 .5rem; white-space: nowrap; }
        #editor { min-height: 360px; background: var(--bs-body-bg); }
        .ql-toolbar.ql-snow,
        .ql-container.ql-snow { border-color: var(--bs-border-color); }
        .cover-preview { width: 140px; height: 86px; object-fit: cover; border: 1px solid var(--bs-border-color); border-radius: 6px; background: var(--bs-tertiary-bg); }
        .preview-body img { max-width: 100%; height: auto; }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a></li></ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" data-lte-toggle="fullscreen"><i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i><i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i></a></li>
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"><img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow" alt="用户头像" /><span id="user-name" class="d-none d-md-inline">管理员</span></a>
                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                            <li class="user-header text-bg-primary"><img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow" alt="用户头像" /><p id="user-title">管理员 - Admin<small id="user-since">今日登录</small></p></li>
                            <li class="user-footer d-flex gap-2"><a id="btn-profile" href="profile.html" class="btn btn-default btn-flat flex-fill">个人资料</a><button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand"><a href="index.html" class="brand-link"><img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" /><span class="brand-text fw-light">GoalHub</span></a></div>
            <div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column sidebar-menu" data-lte-toggle="treeview" role="menu" aria-label="主导航" data-accordion="false" id="navigation"></ul></nav></div>
        </aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <form id="content-form" class="row g-3">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex align-items-center justify-content-between">
                                    <h3 class="card-title mb-0"><i class="bi bi-pencil-square me-2"></i><span id="page-title">新增内容</span></h3>
                                    <div class="d-flex gap-2">
                                        <a class="btn btn-outline-secondary btn-sm" id="btn-back" href="contents.html"><i class="bi bi-arrow-left me-1"></i>返回列表</a>
                                        <button class="btn btn-outline-primary btn-sm" type="button" id="btn-preview"><i class="bi bi-eye me-1"></i>预览</button>
                                        <button class="btn btn-primary btn-sm" type="submit" id="btn-save"><i class="bi bi-save me-1"></i>保存</button>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <input type="hidden" id="c-id">
                                    <div class="row g-3">
                                        <div class="col-12 col-lg-8">
                                            <label class="form-label">标题<span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="c-title" maxlength="200" required>
                                        </div>
                                        <div class="col-6 col-lg-2">
                                            <label class="form-label">类型</label>
                                            <select class="form-select" id="c-type">
                                                <option value="ANNOUNCEMENT">公告</option>
                                                <option value="ARTICLE" selected>文章</option>
                                                <option value="MESSAGE">消息</option>
                                                <option value="HANDICAP_TUTORIAL">盘口教程</option>
                                            </select>
                                        </div>
                                        <div class="col-6 col-lg-2">
                                            <label class="form-label">状态</label>
                                            <select class="form-select" id="c-status">
                                                <option value="DRAFT">草稿</option>
                                                <option value="PUBLISHED">已发布</option>
                                                <option value="OFFLINE">已下架</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">摘要</label>
                                            <textarea class="form-control" id="c-summary" rows="3" maxlength="1000"></textarea>
                                        </div>
                                        <div class="col-12 col-lg-8">
                                            <label class="form-label">封面地址</label>
                                            <input type="url" class="form-control" id="c-coverUrl" placeholder="https://...">
                                        </div>
                                        <div class="col-6 col-lg-2">
                                            <label class="form-label">排序</label>
                                            <input type="number" class="form-control" id="c-sort" value="0">
                                        </div>
                                        <div class="col-6 col-lg-2">
                                            <label class="form-label">发布时间</label>
                                            <input type="datetime-local" class="form-control" id="c-publishTime">
                                        </div>
                                        <div class="col-12 d-flex align-items-center gap-3">
                                            <img class="cover-preview d-none" id="cover-preview" alt="封面预览">
                                            <span class="text-muted small" id="form-meta"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="card">
                                <div class="card-header"><h3 class="card-title mb-0"><i class="bi bi-file-richtext me-2"></i>正文</h3></div>
                                <div class="card-body">
                                    <div id="editor"></div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div class="modal fade" id="preview-modal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-xl modal-dialog-scrollable">
                            <div class="modal-content">
                                <div class="modal-header"><h5 class="modal-title" id="preview-title">内容预览</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
                                <div class="modal-body">
                                    <div class="text-muted mb-3" id="preview-summary"></div>
                                    <div class="preview-body" id="preview-body"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer"><div class="float-end d-none d-sm-inline">GoalHub 管理后台</div><strong>Copyright &copy; 2026&nbsp;<span class="text-decoration-none">GoalHub</span>.</strong> All rights reserved.</footer>
    </div>
    <script src="./js/vendor.js?v=20260617-2"></script>
    <script src="./assets/vendor/quill/dist/quill.js"></script>
    <script src="./js/adminlte.js"></script>
    <script src="./js/page-common.js"></script>
    <script>
        (function () {
            const auth = window.GoalHubAuth;
            const API = '/admin/contents';
            const params = new URLSearchParams(location.search);
            const contentId = params.get('id');
            const embedded = params.get('embedded') === '1' || window.self !== window.top;
            const previewModal = new bootstrap.Modal(document.getElementById('preview-modal'));
            const saveButton = document.getElementById('btn-save');
            const quill = new Quill('#editor', {
                theme: 'snow',
                placeholder: '输入正文内容...',
                modules: {
                    toolbar: [
                        [{ header: [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ color: [] }, { background: [] }],
                        [{ list: 'ordered' }, { list: 'bullet' }, { align: [] }],
                        ['blockquote', 'code-block'],
                        ['link', 'image', 'video'],
                        ['clean'],
                    ],
                },
            });

            function escapeHtml(value) {
                return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function setValue(id, value) {
                const el = document.getElementById(id);
                if (el) el.value = value ?? '';
            }

            function localInputValue(value) {
                if (!value) return '';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return String(value).slice(0, 16);
                const pad = (n) => String(n).padStart(2, '0');
                return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
            }

            function localDateTimeValue(value) {
                if (!value) return null;
                return value.length === 16 ? `${value}:00` : value;
            }

            function backUrl() {
                return embedded ? 'contents.html?embedded=1' : 'contents.html';
            }

            async function request(path, options = {}) {
                const res = await auth.authFetch(path, options);
                const json = await res.json().catch(() => ({}));
                if (!res.ok || ![0, 200, undefined].includes(json.code)) {
                    throw new Error(json.message || '请求失败');
                }
                return json.data;
            }

            function updateCoverPreview() {
                const url = document.getElementById('c-coverUrl').value.trim();
                const img = document.getElementById('cover-preview');
                if (!url) {
                    img.classList.add('d-none');
                    img.removeAttribute('src');
                    return;
                }
                img.src = url;
                img.classList.remove('d-none');
            }

            function fillForm(item) {
                setValue('c-id', item.id);
                setValue('c-title', item.title);
                setValue('c-type', item.type || 'ARTICLE');
                setValue('c-status', item.status || 'DRAFT');
                setValue('c-summary', item.summary);
                setValue('c-coverUrl', item.coverUrl);
                setValue('c-sort', item.sort ?? 0);
                setValue('c-publishTime', localInputValue(item.publishTime));
                quill.root.innerHTML = item.contentHtml || '';
                document.getElementById('form-meta').textContent = `创建时间：${item.createdAt || '-'}，更新时间：${item.updatedAt || '-'}`;
                updateCoverPreview();
            }

            function readPayload() {
                return {
                    type: document.getElementById('c-type').value,
                    title: document.getElementById('c-title').value.trim(),
                    summary: document.getElementById('c-summary').value.trim(),
                    coverUrl: document.getElementById('c-coverUrl').value.trim(),
                    contentHtml: quill.root.innerHTML,
                    status: document.getElementById('c-status').value,
                    sort: Number(document.getElementById('c-sort').value || 0),
                    publishTime: localDateTimeValue(document.getElementById('c-publishTime').value),
                };
            }

            async function loadContent() {
                if (!contentId) return;
                document.getElementById('page-title').textContent = '编辑内容';
                try {
                    const item = await request(`${API}/${encodeURIComponent(contentId)}`);
                    fillForm(item || {});
                } catch (error) {
                    alert(error.message || '加载失败');
                }
            }

            document.getElementById('btn-back').href = backUrl();
            document.getElementById('c-coverUrl').addEventListener('input', updateCoverPreview);

            document.getElementById('btn-preview').addEventListener('click', () => {
                document.getElementById('preview-title').textContent = document.getElementById('c-title').value.trim() || '内容预览';
                document.getElementById('preview-summary').textContent = document.getElementById('c-summary').value.trim();
                document.getElementById('preview-body').innerHTML = quill.root.innerHTML;
                previewModal.show();
            });

            document.getElementById('content-form').addEventListener('submit', async (event) => {
                event.preventDefault();
                const payload = readPayload();
                if (!payload.title) {
                    alert('请输入标题');
                    return;
                }

                saveButton.disabled = true;
                try {
                    if (contentId) {
                        await request(`${API}/${encodeURIComponent(contentId)}`, { method: 'PUT', body: JSON.stringify(payload) });
                    } else {
                        await request(API, { method: 'POST', body: JSON.stringify(payload) });
                    }
                    location.href = backUrl();
                } catch (error) {
                    alert(error.message || '保存失败');
                    saveButton.disabled = false;
                }
            });

            loadContent();
        })();
    </script>
</body>

</html>
