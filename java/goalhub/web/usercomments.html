<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>GoalHub | 用户留言</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <link rel="preload" href="css/adminlte.css" as="style" />
    <link rel="stylesheet" href="./css/vendor.css?v=20260617-2" />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .app-sidebar .sidebar-menu .nav-link { display: flex; align-items: center; }
        .app-sidebar .sidebar-menu .nav-link p { margin: 0 0 0 .5rem; white-space: nowrap; }
        .comment-text { max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .comment-contact { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .comment-detail-box { white-space: pre-wrap; word-break: break-word; }
        .comments-table th,
        .comments-table td { vertical-align: middle; }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a></li></ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" data-lte-toggle="fullscreen"><i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i><i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i></a></li>
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"><img id="user-avatar" src="assets/img/default-avatar.jpg" class="user-image rounded-circle shadow" alt="用户头像" /><span id="user-name" class="d-none d-md-inline">管理员</span></a>
                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                            <li class="user-header text-bg-primary"><img id="user-avatar-large" src="assets/img/default-avatar.jpg" class="rounded-circle shadow" alt="用户头像" /><p id="user-title">管理员 - Admin<small id="user-since">今日登录</small></p></li>
                            <li class="user-footer d-flex gap-2"><a id="btn-profile" href="profile.html" class="btn btn-default btn-flat flex-fill">个人资料</a><button id="btn-signout" class="btn btn-default btn-flat flex-fill">退出登录</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand"><a href="index.html" class="brand-link"><img src="assets/img/goalhub-logo.png" alt="GoalHub Logo" class="brand-image opacity-75 shadow" /><span class="brand-text fw-light">GoalHub</span></a></div>
            <div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column sidebar-menu" data-lte-toggle="treeview" role="menu" aria-label="主导航" data-accordion="false" id="navigation"></ul></nav></div>
        </aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex align-items-center justify-content-between">
                                    <h3 class="card-title mb-0"><i class="bi bi-chat-dots me-2"></i>用户留言</h3>
                                    <button class="btn btn-outline-secondary btn-sm" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button>
                                </div>
                                <div class="card-body">
                                    <form id="filter-form" class="row g-2">
                                        <div class="col-12 col-md-3">
                                            <label class="form-label">用户 ID</label>
                                            <input type="number" class="form-control" id="f-userId" min="1" placeholder="用户 ID">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">每页</label>
                                            <select class="form-select" id="f-pageSize"><option>10</option><option>20</option><option>50</option></select>
                                        </div>
                                        <div class="col-6 col-md-2 d-flex align-items-end">
                                            <button type="submit" class="btn btn-dark w-100"><i class="bi bi-search me-1"></i>查询</button>
                                        </div>
                                        <div class="col-12 col-md-2 d-flex align-items-end">
                                            <button type="button" class="btn btn-outline-secondary w-100" id="btn-reset"><i class="bi bi-x-circle me-1"></i>重置</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="card">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover table-striped mb-0 comments-table">
                                            <thead class="table-light">
                                                <tr>
                                                    <th style="width: 80px;">ID</th>
                                                    <th style="width: 110px;">用户ID</th>
                                                    <th style="width: 240px;">联系方式</th>
                                                    <th>留言内容</th>
                                                    <th style="width: 110px;">回复状态</th>
                                                    <th style="width: 170px;">回复时间</th>
                                                    <th style="width: 170px;">留言时间</th>
                                                    <th style="width: 210px;" class="text-end pe-3">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="comments-tbody"><tr><td colspan="8" class="text-center py-4">加载中...</td></tr></tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div><span id="comments-total">0</span> 条记录</div>
                                        <nav><ul class="pagination pagination-sm mb-0" id="comments-pager"></ul></nav>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="reply-modal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dialog-scrollable">
                            <div class="modal-content">
                                <form id="reply-form">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="reply-title">回复留言</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                                    </div>
                                    <div class="modal-body">
                                        <input type="hidden" id="reply-id">
                                        <div class="row g-3">
                                            <div class="col-6 col-md-3">
                                                <label class="form-label">留言 ID</label>
                                                <input type="text" class="form-control" id="d-id" disabled>
                                            </div>
                                            <div class="col-6 col-md-3">
                                                <label class="form-label">用户 ID</label>
                                                <input type="text" class="form-control" id="d-userId" disabled>
                                            </div>
                                            <div class="col-12 col-md-6">
                                                <label class="form-label">联系方式</label>
                                                <input type="text" class="form-control" id="d-contact" disabled>
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label">留言内容</label>
                                                <div class="form-control comment-detail-box bg-body-tertiary" id="d-message" style="min-height: 110px;"></div>
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label">回复内容<span class="text-danger">*</span></label>
                                                <textarea class="form-control" id="reply-content" rows="6" required placeholder="输入给用户的回复"></textarea>
                                            </div>
                                            <div class="col-12">
                                                <span class="text-muted small" id="d-meta"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">取消</button>
                                        <button class="btn btn-primary" type="submit" id="btn-reply-save"><i class="bi bi-send me-1"></i>发送回复</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer"><div class="float-end d-none d-sm-inline">GoalHub 管理后台</div><strong>Copyright &copy; 2026&nbsp;<span class="text-decoration-none">GoalHub</span>.</strong> All rights reserved.</footer>
    </div>
    <script src="./js/vendor.js?v=20260617-2"></script>
    <script src="./js/adminlte.js"></script>
    <script src="./js/page-common.js"></script>
    <script>
        (function () {
            const auth = window.GoalHubAuth;
            const API = '/admin/usercomments';
            const state = { pageIndex: 1, pageSize: 10, total: 0, records: [] };

            const $form = document.getElementById('filter-form');
            const $tbody = document.getElementById('comments-tbody');
            const $total = document.getElementById('comments-total');
            const $pager = document.getElementById('comments-pager');
            const $replyForm = document.getElementById('reply-form');
            const $replySave = document.getElementById('btn-reply-save');
            const replyModal = new bootstrap.Modal(document.getElementById('reply-modal'));

            function escapeHtml(value) {
                return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function formatDate(value) {
                if (!value) return '-';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return escapeHtml(value);
                return date.toLocaleString();
            }

            async function request(path, body) {
                const res = await auth.authFetch(path, { method: 'POST', body: JSON.stringify(body || {}) });
                const json = await res.json().catch(() => ({}));
                if (!res.ok || ![0, 200, undefined].includes(json.code)) {
                    throw new Error(json.message || '请求失败');
                }
                return json.data;
            }

            function readFilters() {
                const userId = Number(document.getElementById('f-userId').value || 0);
                return {
                    pageIndex: state.pageIndex,
                    pageSize: Number(document.getElementById('f-pageSize').value || 10),
                    userId: userId > 0 ? userId : undefined,
                };
            }

            async function loadComments() {
                $tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4">加载中...</td></tr>';
                try {
                    const page = await request(`${API}/page`, readFilters());
                    state.total = Number(page?.total || 0);
                    state.pageIndex = Number(page?.pageIndex || state.pageIndex);
                    state.pageSize = Number(page?.pageSize || readFilters().pageSize);
                    state.records = Array.isArray(page?.records) ? page.records : [];
                    renderTable();
                    renderPager();
                } catch (error) {
                    $tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4">${escapeHtml(error.message || '加载失败')}</td></tr>`;
                }
            }

            function renderTable() {
                $total.textContent = state.total;
                if (!state.records.length) {
                    $tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4">暂无数据</td></tr>';
                    return;
                }

                $tbody.innerHTML = state.records.map((item) => {
                    const replied = Boolean(item.replyContent || item.replyTime);
                    return `
                        <tr data-id="${escapeHtml(item.id)}">
                            <td>${escapeHtml(item.id)}</td>
                            <td>${escapeHtml(item.userId ?? '-')}</td>
                            <td><div class="comment-contact" title="${escapeHtml(item.contact || '')}">${escapeHtml(item.contact || '-')}</div></td>
                            <td><div class="comment-text" title="${escapeHtml(item.message || '')}">${escapeHtml(item.message || '-')}</div></td>
                            <td><span class="badge ${replied ? 'text-bg-success' : 'text-bg-secondary'}">${replied ? '已回复' : '待回复'}</span></td>
                            <td>${formatDate(item.replyTime)}</td>
                            <td>${formatDate(item.createdAt)}</td>
                            <td class="text-end pe-3">
                                <button class="btn btn-outline-primary btn-sm" data-op="reply"><i class="bi bi-reply me-1"></i>${replied ? '查看/修改回复' : '回复'}</button>
                            </td>
                        </tr>`;
                }).join('');
            }

            function renderPager() {
                const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
                const cur = Math.min(state.pageIndex, pages);
                const items = [];
                const add = (page, label, disabled = false, active = false) => {
                    items.push(`<li class="page-item${disabled ? ' disabled' : ''}${active ? ' active' : ''}"><a class="page-link" href="#" data-page="${page}">${label}</a></li>`);
                };
                add(cur - 1, '&laquo;', cur <= 1);
                const start = Math.max(1, cur - 2);
                const end = Math.min(pages, cur + 2);
                for (let p = start; p <= end; p += 1) add(p, p, false, p === cur);
                add(cur + 1, '&raquo;', cur >= pages);
                $pager.innerHTML = items.join('');
            }

            function fillDetail(item) {
                document.getElementById('reply-id').value = item.id ?? '';
                document.getElementById('d-id').value = item.id ?? '';
                document.getElementById('d-userId').value = item.userId ?? '';
                document.getElementById('d-contact').value = item.contact || '';
                document.getElementById('d-message').textContent = item.message || '';
                document.getElementById('reply-content').value = item.replyContent || '';
                document.getElementById('d-meta').textContent = `留言时间：${item.createdAt || '-'}，回复时间：${item.replyTime || '-'}，更新时间：${item.updatedAt || '-'}`;
                document.getElementById('reply-title').textContent = `回复留言 #${item.id ?? ''}`;
            }

            async function openReply(id, button) {
                button.disabled = true;
                try {
                    const item = await request(`${API}/detail`, { id: Number(id) });
                    fillDetail(item || {});
                    replyModal.show();
                } catch (error) {
                    alert(error.message || '详情加载失败');
                } finally {
                    button.disabled = false;
                }
            }

            $form.addEventListener('submit', (event) => {
                event.preventDefault();
                state.pageIndex = 1;
                loadComments();
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                $form.reset();
                state.pageIndex = 1;
                loadComments();
            });

            document.getElementById('btn-refresh').addEventListener('click', () => loadComments());

            $pager.addEventListener('click', (event) => {
                const link = event.target.closest('[data-page]');
                if (!link || link.parentElement.classList.contains('disabled') || link.parentElement.classList.contains('active')) return;
                event.preventDefault();
                const page = Number(link.dataset.page);
                if (!Number.isFinite(page) || page < 1) return;
                state.pageIndex = page;
                loadComments();
            });

            $tbody.addEventListener('click', (event) => {
                const button = event.target.closest('[data-op="reply"]');
                if (!button) return;
                const id = button.closest('tr')?.dataset.id;
                if (!id) return;
                openReply(id, button);
            });

            $replyForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const id = Number(document.getElementById('reply-id').value || 0);
                const replyContent = document.getElementById('reply-content').value.trim();
                if (!id || !replyContent) {
                    alert('请输入回复内容');
                    return;
                }

                $replySave.disabled = true;
                try {
                    await request(`${API}/reply`, { id, replyContent });
                    replyModal.hide();
                    loadComments();
                } catch (error) {
                    alert(error.message || '回复失败');
                } finally {
                    $replySave.disabled = false;
                }
            });

            loadComments();
        })();
    </script>
</body>

</html>
