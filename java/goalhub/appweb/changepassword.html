<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container app-shell">
        <header class="app-page-header">
            <a class="app-back" href="setting.html">‹</a>
            <h1 class="app-title">修改密码</h1>
            <span class="balance">💰 0.00</span>
        </header>

        <main class="app-content">
            <section class="app-card">
                <form id="changePasswordForm" class="password-form">
                    <label class="password-field">
                        <span>原密码</span>
                        <input class="password-input" id="oldPassword" type="password" autocomplete="current-password" placeholder="请输入原密码">
                    </label>
                    <label class="password-field">
                        <span>新密码</span>
                        <input class="password-input" id="newPassword" type="password" autocomplete="new-password" placeholder="请输入新密码">
                    </label>
                    <label class="password-field">
                        <span>确认新密码</span>
                        <input class="password-input" id="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入新密码">
                    </label>
                    <div class="password-message" id="passwordMessage"></div>
                    <button class="app-primary-btn password-submit" id="changePasswordBtn" type="submit">确认修改</button>
                </form>
            </section>
        </main>

        <div class="index-footer">
            <a class="footer-item" href="tutorial.html"><span class="footer-icon">📋</span><span>盘口教程</span></a>
            <a class="footer-item" href="service.html"><span class="footer-icon">⚙️</span><span>客服页面</span></a>
            <a class="footer-item" href="bettings.html#open"><span class="footer-icon">📋</span><span>未结注单</span></a>
            <a class="footer-item" href="bettings.html#settled"><span class="footer-icon">✔️</span><span>已结注单</span></a>
            <a class="footer-item active" href="myprofile.html"><span class="footer-icon">👤</span><span>我的</span></a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/changepassword.js"></script>
</body>
</html>
