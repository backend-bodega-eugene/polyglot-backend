<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-fund-type="deposit">
    <div class="container app-shell">
        <header class="app-page-header">
            <a class="app-back" href="myprofile.html">‹</a>
            <h1 class="app-title">充值</h1>
            <a class="app-header-link" href="deposithistory.html">历史记录</a>
        </header>

        <main class="app-content">
            <section class="app-card">
                <div class="app-card-title">提交充值订单</div>
                <form id="fundOrderForm" class="fund-form">
                    <label class="fund-field">
                        <span>币种</span>
                        <input class="fund-input" id="currencyCode" type="text" value="USDT" readonly>
                    </label>
                    <label class="fund-field">
                        <span>充值金额</span>
                        <input class="fund-input" id="amount" type="number" min="0.01" step="0.01" placeholder="请输入充值金额">
                    </label>
                    <label class="fund-field">
                        <span>链类型</span>
                        <input class="fund-input" id="chainType" type="text" placeholder="例如 TRC20 / ERC20">
                    </label>
                    <label class="fund-field">
                        <span>交易哈希</span>
                        <input class="fund-input" id="txHash" type="text" placeholder="请输入链上交易哈希">
                    </label>
                    <label class="fund-field">
                        <span>备注</span>
                        <textarea class="fund-input fund-textarea" id="remark" placeholder="可选"></textarea>
                    </label>
                    <div class="fund-message" id="fundMessage"></div>
                    <button class="app-primary-btn fund-submit" id="fundSubmitBtn" type="submit">提交充值</button>
                </form>
            </section>
        </main>

        <div class="index-footer">
            <a class="footer-item" href="tutorial.html"><span class="footer-icon">📋</span><span>盘口教程</span></a>
            <a class="footer-item" href="service.html"><span class="footer-icon">⚙️</span><span>客服页面</span></a>
            <a class="footer-item" href="bettings.html#open"><span class="footer-icon">📋</span><span>未结注单</span></a>
            <a class="footer-item" href="bettings.html#settled"><span class="footer-icon">✔️</span><span>已结注单</span></a>
            <a class="footer-item active" href="myprofile.html"><span class="footer-icon">👤</span><span>我的</span></a>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/fundorder.js"></script>
</body>
</html>
