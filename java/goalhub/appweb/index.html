<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalHub - 体育投注</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="container">
        <!-- 头部 - 标题和余额 -->
        <div class="index-header">
            <div class="header-top">
                <span class="back-btn">&lt;</span>
                <span class="balance">💰 0.00</span>
            </div>

            <!-- 主导航标签 -->
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="today">今日</button>
                <button class="nav-tab" data-tab="ball">gun球</button>
                <button class="nav-tab" data-tab="early">早盘</button>
                <button class="nav-tab" data-tab="combo">串关</button>
                <button class="nav-tab" data-tab="champion">冠军</button>
                <button class="nav-tab" data-tab="results">赛果</button>
            </div>

        </div>

        <!-- 体育分类导航 -->
        <div class="sports-nav">
            <!-- <div class="nav-item active">🏀 主播</div> -->
            <div class="nav-item">⭐ 收藏</div>
            <div class="nav-item">📋 注单</div>
            <div class="nav-item">🔥 热门</div>
            <div class="nav-item">⚽ 足球</div>
            <!-- <div class="nav-item" style="opacity: 0.4;">🏀 篮球</div>
            <div class="nav-item" style="opacity: 0.4;">🥎 VR体育</div> -->
            <div class="nav-item">
                <input type="search" placeholder="🔍" class="search-input">
            </div>
        </div>

        <!-- 联盟和赛事区域 -->
        <div class="content-wrapper">
            <!-- 左侧：联盟列表（蓝色区域） -->
            <div class="leagues-section">
                <div class="section-title">全部</div>
                <div class="leagues-list" id="leaguesList">
                    <!-- 联盟会动态加载 -->
                </div>
            </div>

            <!-- 右侧：赛事列表（红色区域） -->
            <div class="matches-section">
                <div class="section-header">
                    <span class="status-filter active">进行中</span>
                    <span class="sort-btn">收起 ▼</span>
                </div>

                <div class="matches-list" id="matchesList">
                    <!-- 赛事项会动态加载 -->
                </div>

                <!-- 加载更多 -->
                <div class="load-more" id="loadMoreBtn" style="display: none;">
                    <span>加载更多...</span>
                </div>
            </div>
        </div>

        <!-- 底部菜单栏 -->
        <div class="index-footer">
            <div class="footer-item active">
                <span class="footer-icon">📋</span>
                <span>盘口教程</span>
            </div>
            <div class="footer-item">
                <span class="footer-icon">⚙️</span>
                <span>设置菜单</span>
            </div>
            <div class="footer-item">
                <span class="footer-icon">📋</span>
                <span>未结注单</span>
            </div>
            <div class="footer-item">
                <span class="footer-icon">✔️</span>
                <span>已结注单</span>
            </div>
            <div class="footer-item">
                <span class="footer-icon">🔄</span>
                <span>刷新</span>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
