<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冠军玩法 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container app-shell champion-shell">
        <header class="app-page-header">
            <a class="app-back" href="index.html">‹</a>
            <h1 class="app-title">冠军玩法</h1>
            <span class="balance">💰 0.00</span>
        </header>

        <main class="champion-layout">
            <aside class="champion-leagues">
                <div class="champion-side-title">联赛 / 杯赛</div>
                <div class="champion-league-list" id="championLeagueList"></div>
            </aside>

            <section class="champion-main">
                <div class="champion-toolbar">
                    <div>
                        <div class="champion-toolbar-title" id="championTitle">冠军玩法赛事</div>
                        <div class="champion-toolbar-subtitle" id="championSummary">请选择联赛 / 杯赛</div>
                    </div>
                    <button class="champion-refresh" id="championRefreshBtn" type="button">刷新</button>
                </div>

                <div class="champion-list" id="championList"></div>
                <button class="order-load-more champion-load-more" id="championLoadMoreBtn" type="button" style="display:none;">加载更多</button>
                <div class="app-empty" id="championEmpty" style="display:none;">
                    <div class="app-empty-icon">🏆</div>
                    <div id="championEmptyText">暂无冠军赔率</div>
                </div>
            </section>
        </main>

        <div class="index-footer"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/champion.js"></script>
</body>
</html>
