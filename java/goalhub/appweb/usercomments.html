<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服留言 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container app-shell">
        <header class="app-page-header">
            <a class="app-back" href="service.html">‹</a>
            <h1 class="app-title">客服留言</h1>
            <span class="balance">💰 0.00</span>
        </header>

        <main class="app-content">
            <section class="app-card">
                <div class="app-card-title">提交留言</div>
                <form id="commentForm" class="comment-form">
                    <input class="comment-input" id="commentContact" type="text" placeholder="联系方式">
                    <textarea class="comment-input comment-textarea" id="commentMessage" placeholder="请输入留言内容"></textarea>
                    <div class="comment-actions">
                        <button class="app-primary-btn comment-submit" id="commentSubmitBtn" type="submit">提交留言</button>
                    </div>
                    <div class="comment-message" id="commentMessageTip"></div>
                </form>
            </section>

            <section class="comment-history">
                <div class="comment-history-head">
                    <div class="app-card-title">历史留言</div>
                    <button class="comment-refresh" id="commentRefreshBtn" type="button">刷新</button>
                </div>
                <div id="commentList" class="comment-list">
                    <div class="comment-empty">留言加载中...</div>
                </div>
                <button class="order-load-more" id="commentsLoadMoreBtn" type="button" style="display:none;">加载更多</button>
            </section>
        </main>

        <div class="index-footer">
            <a class="footer-item" href="tutorial.html"><span class="footer-icon">📋</span><span>盘口教程</span></a>
            <a class="footer-item active" href="service.html"><span class="footer-icon">⚙️</span><span>客服页面</span></a>
            <a class="footer-item" href="bettings.html#open"><span class="footer-icon">📋</span><span>未结注单</span></a>
            <a class="footer-item" href="bettings.html#settled"><span class="footer-icon">✔️</span><span>已结注单</span></a>
            <a class="footer-item" href="myprofile.html"><span class="footer-icon">👤</span><span>我的</span></a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/usercomments.js"></script>
</body>
</html>
