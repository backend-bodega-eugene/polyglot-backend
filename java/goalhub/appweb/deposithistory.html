<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值历史 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-history-type="deposit">
    <div class="container app-shell">
        <header class="app-page-header">
            <a class="app-back" href="deposit.html">‹</a>
            <h1 class="app-title">充值历史</h1>
            <span class="balance">💰 0.00</span>
        </header>

        <main class="app-content">
            <div class="app-section fund-history-head">
                <span id="historySummary">USDT 充值订单</span>
                <button class="comment-refresh" id="historyRefreshBtn" type="button">刷新</button>
            </div>
            <div id="historyList" class="fund-history-list"></div>
            <div class="app-empty" id="historyEmpty" style="display:none;">
                <div class="app-empty-icon">🗂️</div>
                <div>暂无充值订单</div>
            </div>
            <button class="order-load-more" id="historyLoadMoreBtn" type="button" style="display:none;">加载更多</button>
        </main>

        <div class="index-footer">
            <a class="footer-item" href="tutorial.html"><span class="footer-icon">📋</span><span>盘口教程</span></a>
            <a class="footer-item" href="service.html"><span class="footer-icon">⚙️</span><span>客服页面</span></a>
            <a class="footer-item" href="bettings.html#open"><span class="footer-icon">📋</span><span>未结注单</span></a>
            <a class="footer-item" href="bettings.html#settled"><span class="footer-icon">✔️</span><span>已结注单</span></a>
            <a class="footer-item active" href="myprofile.html"><span class="footer-icon">👤</span><span>我的</span></a>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/fundhistory.js"></script>
</body>
</html>
