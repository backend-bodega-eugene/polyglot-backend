<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改资料 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container app-shell">
        <header class="app-page-header">
            <a class="app-back" href="setting.html">‹</a>
            <h1 class="app-title">修改资料</h1>
            <span class="balance">💰 0.00</span>
        </header>

        <main class="app-content">
            <section class="app-card">
                <form id="profileForm" class="password-form">
                    <label class="password-field">
                        <span>邮箱</span>
                        <input class="password-input" id="email" type="email" autocomplete="email" placeholder="请输入邮箱">
                    </label>
                    <label class="password-field">
                        <span>电话号码</span>
                        <input class="password-input" id="phone" type="tel" autocomplete="tel" placeholder="请输入电话号码">
                    </label>
                    <label class="password-field">
                        <span>昵称</span>
                        <input class="password-input" id="nickname" type="text" autocomplete="nickname" placeholder="请输入昵称">
                    </label>
                    <label class="password-field">
                        <span>头像地址</span>
                        <input class="password-input" id="avatarUrl" type="text" autocomplete="off" placeholder="请输入头像地址">
                    </label>
                    <div class="password-message" id="profileMessage"></div>
                    <button class="app-primary-btn password-submit" id="profileSubmitBtn" type="submit">保存资料</button>
                </form>
            </section>
        </main>

        <div class="index-footer">
            <a class="footer-item" href="tutorial.html"><span class="footer-icon">📋</span><span>盘口教程</span></a>
            <a class="footer-item" href="service.html"><span class="footer-icon">⚙️</span><span>客服页面</span></a>
            <a class="footer-item" href="bettings.html#open"><span class="footer-icon">📋</span><span>未结注单</span></a>
            <a class="footer-item" href="bettings.html#settled"><span class="footer-icon">✔️</span><span>已结注单</span></a>
            <a class="footer-item active" href="myprofile.html"><span class="footer-icon">👤</span><span>我的</span></a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/editprofile.js"></script>
</body>
</html>
