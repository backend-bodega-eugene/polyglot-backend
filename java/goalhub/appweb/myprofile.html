<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container app-shell">
        <header class="app-page-header">
            <span></span>
            <h1 class="app-title">我的</h1>
            <span class="balance">💰 0.00</span>
        </header>

        <main class="app-content">
            <section class="app-section profile-summary">
                <div class="profile-avatar" id="avatarText">L</div>
                <div>
                    <div class="profile-name" id="profileName">用户</div>
                </div>
            </section>

            <section class="app-section">
                <div class="wallet-actions">
                    <a class="wallet-action" href="deposit.html"><span class="wallet-action-icon">🎁</span><span>存款</span></a>
                    <a class="wallet-action" href="withdraw.html"><span class="wallet-action-icon">💳</span><span>取款</span></a>
                </div>
            </section>

            <nav>
                <a class="app-row" href="index.html"><span class="app-row-left"><span>⌂</span>返回首页</span><span class="app-chevron">›</span></a>
                <a class="app-row" href="transactions.html"><span class="app-row-left"><span>💼</span>账户流水查询</span><span class="app-chevron">›</span></a>
                <a class="app-row" href="bettings.html#open"><span class="app-row-left"><span>🧾</span>投注记录</span><span class="app-chevron">›</span></a>
                <a class="app-row" href="setting.html"><span class="app-row-left"><span>⚙️</span>设置</span><span class="app-chevron">›</span></a>
                <a class="app-row" href="changepassword.html"><span class="app-row-left"><span>?</span>修改密码</span><span class="app-chevron">›</span></a>
                <a class="app-row" href="about.html"><span class="app-row-left"><span>ℹ</span>关于</span><span class="app-chevron">›</span></a>
                <a class="app-row" href="login.html" id="logoutLink" style="justify-content:center; color:#e74c3c; font-weight:700;">退出或者重新登陆</a>
            </nav>
        </main>

        <div class="index-footer">
            <a class="footer-item" href="tutorial.html"><span class="footer-icon">📋</span><span>盘口教程</span></a>
            <a class="footer-item" href="service.html"><span class="footer-icon">⚙️</span><span>客服页面</span></a>
            <a class="footer-item" href="bettings.html#open"><span class="footer-icon">📋</span><span>未结注单</span></a>
            <a class="footer-item" href="bettings.html#settled"><span class="footer-icon">✔️</span><span>已结注单</span></a>
            <a class="footer-item active" href="myprofile.html"><span class="footer-icon">👤</span><span>我的</span></a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        const username = localStorage.getItem('currentNickname') || localStorage.getItem('currentUsername') || '用户';
        document.getElementById('profileName').textContent = username;
        document.getElementById('avatarText').textContent = username.slice(0, 1).toUpperCase();
    </script>
</body>
</html>
