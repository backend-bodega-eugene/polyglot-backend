<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - GoalHub</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">GoalHub</div>
            <div class="subtitle">找回账号密码</div>
        </div>

        <form id="forgotPasswordForm" class="form">
            <div id="emailStep">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="请输入注册邮箱"
                        required
                    >
                    <span class="error-msg" id="emailError"></span>
                </div>
                <button type="button" class="btn-submit" id="sendCodeBtn">下一步</button>
            </div>

            <div id="resetStep" class="forgot-step-hidden">
                <div class="form-group">
                    <label for="resetEmail">邮箱</label>
                    <input
                        type="email"
                        id="resetEmail"
                        name="resetEmail"
                        readonly
                    >
                </div>
                <div class="form-group">
                    <label for="emailCode">邮件验证码</label>
                    <input
                        type="text"
                        id="emailCode"
                        name="emailCode"
                        placeholder="请输入邮件验证码"
                    >
                    <span class="error-msg" id="codeError"></span>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="请输入新密码"
                    >
                    <span class="error-msg" id="newPasswordError"></span>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="请再次输入新密码"
                    >
                    <span class="error-msg" id="confirmPasswordError"></span>
                </div>
                <button type="submit" class="btn-submit" id="resetPasswordBtn">重置密码</button>
            </div>

            <span class="error-msg" id="formError"></span>
        </form>

        <div class="footer-nav forgot-footer-nav">
            <a href="/login.html" class="footer-btn" style="text-decoration: none;">
                <span class="icon">👤</span>
                <span>返回登录</span>
            </a>
            <a href="/service.html" class="footer-btn" style="text-decoration: none;">
                <span class="icon">💬</span>
                <span>前往客服</span>
            </a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/forgotpassword.js"></script>
</body>
</html>
